<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>NBA王朝缔造者 · 82-0 完美赛季大挑战 · 腾讯体育</title>
  <!-- 微信分享卡片 -->
  <meta name="description" content="组建王朝阵容，挑战82胜！" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="NBA王朝缔造者 · 82-0 完美赛季大挑战" />
  <meta property="og:description" content="组建王朝阵容，挑战82胜！" />
  <meta property="og:image" content="./assets/share.png" />
  <style>
    :root {
      /* 腾讯体育主视觉：体育蓝为品牌主色，橙色作强调点缀（深色球馆沉浸风） */
      --tx-blue: #2f7bff;
      --tx-blue-deep: #1a5fe0;
      --tx-blue-soft: rgba(47, 123, 255, 0.16);
      --tx-orange: #ff8a2b;
      --tx-orange-deep: #e85d00;
      --tx-gold: #ffcf5c;
      /* 深色球馆基调 */
      --bg-0: #0a0f1f;
      --bg-1: #131b30;
      --card: rgba(22, 30, 52, 0.78);
      --card-border: rgba(120, 150, 210, 0.18);
      --line: rgba(120, 150, 210, 0.14);
      --text-1: #f2f5fb;
      --text-2: #9aa6c4;
      --text-3: #6c7796;
      --ok: #2bd576;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      overflow-x: hidden;
    }
    /* 篮球馆沉浸背景：顶部聚光灯 + 木地板色温 + 边缘暗角 */
    #app {
      max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 24px;
      color: var(--text-1);
      background:
        radial-gradient(120% 60% at 50% -8%, rgba(80, 130, 255, 0.22) 0%, rgba(80, 130, 255, 0) 55%),
        radial-gradient(90% 50% at 50% 108%, rgba(255, 138, 43, 0.12) 0%, rgba(255, 138, 43, 0) 60%),
        linear-gradient(180deg, #0c1426 0%, #0a0f1f 45%, #070b16 100%);
    }
    /* 球场地板纹理：底部一层球场线条质感（纯 CSS，无需图片） */
    #app::before {
      content: ''; position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 0; width: 480px; max-width: 100%; height: 42%;
      background:
        repeating-linear-gradient(90deg, rgba(180, 120, 60, 0.05) 0 2px, transparent 2px 26px),
        linear-gradient(180deg, rgba(120, 78, 40, 0) 0%, rgba(120, 78, 40, 0.14) 60%, rgba(150, 96, 48, 0.22) 100%);
      pointer-events: none; z-index: 0;
    }
    #screen-root { position: relative; z-index: 1; }
    /* 顶部腾讯体育条：深色玻璃品牌栏 */
    .tx-topbar {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px;
      font-size: 13px; color: var(--text-2);
      background: rgba(10, 15, 31, 0.82);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 30;
    }
    .tx-logo {
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 800; color: var(--text-1); font-size: 15px;
    }
    /* 腾讯体育官方横版 logo（图标+反白文字），直接使用 assets/tx-logo.png，原图比例 1727x385 */
    .tx-logo-icon {
      display: block; height: 22px; width: calc(22px * 1727 / 385); flex: none;
      background: url('./assets/tx-logo.png') left center / contain no-repeat;
    }
    .tx-tag { margin-left: auto; font-size: 11px; padding: 3px 8px; border: 1px solid var(--card-border); border-radius: 20px; color: var(--text-2); }
    /* 「NBA王朝缔造者」动感艺术字：金橙渐变 + 流光扫过 + 微倾斜 */
    .dynasty-art {
      position: relative;
      font-size: 18px; font-weight: 900; font-style: italic;
      letter-spacing: 1px; line-height: 1;
      background: linear-gradient(95deg, #ffe39a 0%, #ffb24d 22%, #ff7a18 48%, #ffd24d 70%, #ffb24d 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 1px 3px rgba(255,122,24,.45));
      animation: dynastyFlow 3.2s ease-in-out infinite;
    }
    /* 流光横扫高光 */
    .dynasty-art::after {
      content: 'NBA王朝缔造者';
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.95) 50%, transparent 65%);
      background-size: 240% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: dynastyShine 3.2s ease-in-out infinite;
    }
    @keyframes dynastyFlow {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes dynastyShine {
      0% { background-position: 140% 0; }
      55%,100% { background-position: -60% 0; }
    }
    /* 结算页等底部品牌出品落款 */
    .brand-footer {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      margin: 22px 0 6px; font-size: 12px; font-weight: 700;
      color: var(--text-3); letter-spacing: .5px;
    }
    .brand-footer-icon {
      display: block; height: 16px; width: calc(16px * 1727 / 385); flex: none;
      background: url('./assets/tx-logo.png') center / contain no-repeat;
      opacity: .9;
    }

    .hidden { display: none !important; }

    .screen { padding: 0 16px; animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ===== 标题 ===== */
    .hero-title {
      text-align: center; margin: 18px 0 8px;
      font-size: 38px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(180deg, #fff 0%, #ffe7c2 55%, var(--tx-orange) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 26px rgba(255,138,43,.28);
      font-style: italic;
    }
    .hero-sub { text-align: center; color: var(--tx-gold); font-weight: 800; font-size: 15px; margin-bottom: 4px; }
    .hero-slogan { text-align: center; color: var(--text-2); font-size: 13px; margin-bottom: 22px; }

    .home-desc {
      text-align: center; line-height: 2; color: #dfe6ff; font-size: 15px;
      margin: 30px 0; padding: 0 10px;
    }
    .home-desc b { color: var(--tx-gold); }

    /* ===== 首页 ===== */
    .screen-home { position: relative; padding: 0; overflow: hidden; height: calc(100vh - 50px); }
    .home-inner {
      position: relative; z-index: 1;
      padding: 8px 16px 14px;
      display: flex; flex-direction: column; height: calc(100vh - 50px);
    }
    /* 三张全明星合影上下竖排、紧挨连续不分开；高度压缩并裁切，保证首页一屏完整露出 */
    .legend-stack {
      display: flex; flex-direction: column; gap: 2px;
      border-radius: 12px; overflow: hidden;
      margin: 4px 0 10px;
      border: 1px solid rgba(150,180,255,.28);
      box-shadow: 0 6px 20px rgba(0,0,0,.5);
      background: var(--bg-0);
      flex: none;
    }
    .legend-stack-card { width: 100%; line-height: 0; }
    .legend-stack-card img {
      display: block; width: 100%;
      height: clamp(120px, 18.5vh, 185px);
      object-fit: cover; object-position: center 42%;
    }
    /* 首页顶部品牌横版 logo（图标 + 反白「腾讯体育」文字），呼应官方双色球标识 */
    .home-brand {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 18px 0 2px;
    }
    .home-brand-icon {
      display: block; height: 46px; width: calc(46px * 1727 / 385); flex: none;
      background: url('./assets/tx-logo.png') center / contain no-repeat;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.5));
    }
    .home-brand-text {
      font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }
    /* 一屏紧凑：标题缩小、间距收紧 */
    .screen-home .hero-title {
      margin: 6px 0 2px; font-size: 34px;
      background: linear-gradient(180deg, #fff 0%, #ffe7c2 60%, var(--tx-orange) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 24px rgba(0,0,0,.55);
    }
    .screen-home .hero-sub { color: var(--tx-gold); text-shadow: 0 2px 12px rgba(0,0,0,.7); margin-bottom: 2px; }
    .screen-home .hero-slogan { color: #e9eeff; font-size: 13px; font-weight: 600; letter-spacing: .5px; text-shadow: 0 2px 12px rgba(0,0,0,.8); margin-bottom: 6px; }
    /* 参与人次统计胶囊 */
    .home-stat {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      margin: 2px auto 0; padding: 6px 16px; width: fit-content;
      background: rgba(10,14,39,.55); border: 1px solid rgba(120,160,255,.35);
      border-radius: 999px; backdrop-filter: blur(4px);
      font-size: 13px; color: #e9eeff; font-weight: 600;
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
    }
    .home-stat .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #2bd576; box-shadow: 0 0 8px #2bd576; animation: livePulse 1.6s ease-in-out infinite; }
    .home-stat .stat-num { color: var(--tx-gold); font-weight: 800; font-variant-numeric: tabular-nums; }
    @keyframes livePulse { 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.45; transform:scale(.7);} }
    .screen-home .home-desc { margin: 10px 0 12px; line-height: 1.75; font-size: 14px; text-shadow: 0 2px 10px rgba(0,0,0,.85); }
    /* 按钮区紧跟文案下方，整体上移（不再推到屏幕最底部） */
    .screen-home .btn:first-of-type { margin-top: 18px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 800; color: #fff; cursor: pointer;
      margin-bottom: 12px; transition: transform .12s ease, box-shadow .2s, background .2s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: linear-gradient(135deg, var(--tx-orange) 0%, var(--tx-orange-deep) 100%); box-shadow: 0 6px 22px rgba(255,138,43,.35); }
    .btn-secondary { background: rgba(255,255,255,.08); border: 1px solid rgba(150,180,255,.4); color: #dfe7ff; backdrop-filter: blur(6px); }
    .btn-ghost { background: var(--tx-blue-soft); border: 1px solid rgba(80,140,255,.4); color: #cfe0ff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    /* ===== 阵容面板 ===== */
    .lineup-board {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin: 14px 0 8px; place-items: center;
    }
    .slot {
      width: 100%; aspect-ratio: 3/4; border-radius: 12px;
      border: 1.5px dashed rgba(140,165,220,.35); background: var(--card);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; position: relative; overflow: visible; cursor: pointer;
      transition: border-color .2s, transform .15s, box-shadow .2s;
    }
    .slot:not(.filled):hover { border-color: var(--tx-blue); }
    .slot.pg, .slot.sg { } /* 前两个占第1行中间靠两侧 */
    .slot .pos-label { font-size: 13px; font-weight: 800; color: var(--text-3); letter-spacing: 1px; }
    .slot.filled { border-style: solid; border-color: var(--tx-blue); background: linear-gradient(160deg, rgba(47,123,255,.22), rgba(22,30,52,.85)); box-shadow: 0 4px 16px rgba(47,123,255,.18); }
    .slot.filled.movable { border-color: rgba(255,177,61,.75); box-shadow: 0 4px 18px rgba(255,138,43,.22); }
    .slot.filled.movable:active { transform: scale(.98); }
    .slot.filled .pos-label { color: #8fb4ff; }
    .slot .p-name { font-size: 13px; font-weight: 800; text-align: center; padding: 0 2px; line-height: 1.2; color: var(--text-1); }
    .slot .p-stat { font-size: 10px; color: var(--tx-orange); font-weight: 700; }
    .slot .p-team { font-size: 9px; color: var(--text-2); }
    .slot .p-move { font-size: 9px; color: var(--tx-gold); font-weight: 700; line-height: 1; }
    /* 标签骑在卡片右上边框上（往上挪出框外一点，避免压住位置/球员名） */
    .slot .tier-badge { position: absolute; top: -9px; right: -6px; z-index: 2; }
    /* 段位文字标签：超巨（金）/ 顶级球星（紫红）/ 全明星（蓝） */
    .tier-tag { display:inline-block; font-size:10px; font-weight:800; line-height:1; padding:3px 7px; border-radius:6px; margin-right:5px; vertical-align:middle; letter-spacing:.5px; box-shadow:0 2px 6px rgba(0,0,0,.18); }
    .tier-tag.tier-legend { color:#3a2a00; background:linear-gradient(135deg,#ffd98a,#ffb13d); }
    .tier-tag.tier-tier2 { color:#fff; background:linear-gradient(135deg,#b06cff,#7b3ff2); }
    .tier-tag.tier-star { color:#fff; background:linear-gradient(135deg,#4f8bff,#2f7bff); }
    .tier-tag.tier-mvp { color:#3a2a00; background:linear-gradient(135deg,#ffd700,#ffa500); }
    .slot .tier-badge .tier-tag { margin-right:0; }
    .board-tip { text-align: center; color: var(--text-2); font-size: 12px; margin: 4px 0 16px; }

    /* ===== 主教练级别标签 ===== */
    .coach-tag { display:inline-block; font-size:11px; font-weight:800; line-height:1; padding:3px 8px; border-radius:6px; vertical-align:middle; letter-spacing:.5px; white-space:nowrap; }
    .coach-tag.coach-master { color:#3a2a00; background:linear-gradient(135deg,#ffe27a,#ffb13d); }
    .coach-tag.coach-elite  { color:#fff; background:linear-gradient(135deg,#b06bff,#6a1bd0); }
    .coach-tag.coach-solid  { color:#fff; background:linear-gradient(135deg,#3aa0ff,#2f7bff); }
    .coach-tag.coach-normal { color:var(--text-2); background:rgba(255,255,255,.06); border:1px solid var(--card-border); }

    /* ===== 选主教练页 ===== */
    .coach-group-title { display:flex; align-items:center; gap:10px; margin:18px 0 10px; }
    .coach-group-title small { color: var(--text-2); font-size: 11px; font-weight: 400; }
    .coach-card {
      display:flex; align-items:center; gap:10px;
      background: var(--card); border:1px solid var(--card-border);
      border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
      box-shadow: var(--shadow);
      transition: transform .12s, border-color .2s, box-shadow .2s;
    }
    .coach-card:active { transform: scale(.98); }
    .coach-card-master { border-color: rgba(245,166,35,.55); }
    .coach-card-elite  { border-color: rgba(176,107,255,.45); }
    .coach-card .cc-name { font-weight: 800; font-size: 15px; }
    .coach-card .cc-title { font-size: 11px; color: var(--text-2); margin-top: 4px; }
    .coach-card .cc-tag { margin-left: auto; flex-shrink: 0; }

    /* ===== 选战术页：外层不滚动，仅下方战术列表滚动 ===== */
    /* 关键：让 #app 与 #screen-root 都成为撑满高度的 flex 列容器，
       .screen-tactic 用 flex:1 自适应，避免写死高度算错导致内层 scroll 高度为 0 滑不动 */
    #app.app-tactic {
      height: 100vh; height: 100dvh; min-height: 0;
      padding-bottom: 0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    #app.app-tactic::before { display: none; }
    #app.app-tactic .tx-topbar { flex: none; position: static; }
    #app.app-tactic #screen-root {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .screen-tactic {
      flex: 1; min-height: 0;
      overflow: hidden; display: flex; flex-direction: column; padding-bottom: 0;
    }
    .tactic-fixed { flex: none; }
    .tactic-scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 2px 0 18px; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .screen-tactic .lineup-row .slot { aspect-ratio: auto; min-height: 74px; padding: 4px 2px; }
    .screen-tactic .lineup-row { margin-bottom: 6px; }
    .screen-tactic .slot .p-name { font-size: 12px; }
    .screen-tactic .slot .pos-label { font-size: 12px; }
    .screen-tactic .slot .p-move { display: none; }

    /* ===== 结算页主教练 ===== */
    .result-coach {
      display:flex; align-items:center; gap:10px;
      background: var(--tx-blue-soft);
      border:1px solid rgba(80,140,255,.35); border-radius:10px; padding:8px 12px; margin: 0 0 8px;
    }
    .result-coach .rc-role { font-size:11px; color: var(--text-2); margin-bottom:2px; }
    .result-coach .rc-name { font-weight:800; font-size:14px; }
    .result-coach .rc-title { font-size:11px; color: var(--tx-orange); margin-top:2px; }

    /* ===== 结算页：二维码邀请区 ===== */
    .qr-invite {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: linear-gradient(135deg, rgba(255,207,92,.08), rgba(255,138,43,.08));
      border: 1px solid rgba(255,207,92,.3); border-radius: 12px;
      padding: 14px 16px; margin: 12px 0 6px;
    }
    .qr-invite .qr-left {
      display: flex; align-items: center; gap: 10px; flex-shrink:0;
    }
    .qr-invite .qr-left .qr-img { width:72px; height:72px; border-radius:8px; }
    .qr-invite .qr-left .qr-caption { font-size:13px; font-weight:700; color: var(--tx-orange); white-space:nowrap; }
    .qr-invite .qr-right .btn-prize {
      background: linear-gradient(135deg, #ff4d4f, #ff7875);
      color: #fff; font-size:13px; font-weight:700;
      border: none; border-radius: 20px; padding: 9px 18px;
      cursor:pointer; white-space:nowrap; transition:transform .15s;
    }
    .qr-invite .qr-right .btn-prize:active { transform: scale(.95); }

    /* ===== 结算页：球队徽章 ===== */
    .result-badges {
      display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 18px;
    }
    .result-badges .badge {
      flex: 1 1 calc(50% - 5px); min-width: 0;
      border-radius: 12px; padding: 10px 12px;
      position: relative; overflow: hidden;
    }
    .result-badges .badge-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .result-badges .badge-tag {
      font-size: 10px; font-weight: 900; letter-spacing: 1px;
      padding: 2px 7px; border-radius: 6px; color: #1a1d29;
    }
    .result-badges .badge-name { font-size: 14px; font-weight: 900; }
    .result-badges .badge-desc { font-size: 11px; line-height: 1.45; color: var(--text-2); }
    /* 金色：曼巴精神 */
    .result-badges .badge-gold {
      background: linear-gradient(150deg, rgba(255,196,73,.22), rgba(255,138,43,.08));
      border: 1px solid rgba(255,196,73,.55);
      box-shadow: 0 4px 18px rgba(255,138,43,.18);
    }
    .result-badges .badge-gold .badge-tag { background: linear-gradient(95deg, #ffe39a, #ffb24d); }
    .result-badges .badge-gold .badge-name { color: var(--tx-gold); }
    /* 蓝色：顶级化学反应 */
    .result-badges .badge-blue {
      background: linear-gradient(150deg, rgba(72,176,255,.20), rgba(47,123,255,.08));
      border: 1px solid rgba(72,176,255,.55);
      box-shadow: 0 4px 18px rgba(47,123,255,.18);
    }
    .result-badges .badge-blue .badge-tag { background: linear-gradient(95deg, #8fd4ff, #48b0ff); }
    .result-badges .badge-blue .badge-name { color: #6fc0ff; }
    /* 红色：巨星内耗（负向警告） */
    .result-badges .badge-red {
      background: linear-gradient(150deg, rgba(255,93,93,.22), rgba(255,40,40,.08));
      border: 1px solid rgba(255,93,93,.55);
      box-shadow: 0 4px 18px rgba(255,60,60,.18);
    }
    .result-badges .badge-red .badge-tag { background: linear-gradient(95deg, #ff9c9c, #ff5d5d); color: #fff; }
    .result-badges .badge-red .badge-name { color: #ff7a7a; }

    .result-badges .badge-orange {
      background: linear-gradient(150deg, rgba(255,138,43,.22), rgba(232,93,0,.08));
      border: 1px solid rgba(255,138,43,.55);
      box-shadow: 0 4px 18px rgba(255,120,30,.18);
    }
    .result-badges .badge-orange .badge-tag { background: linear-gradient(95deg, #ffb24d, #e85d00); color: #fff; }

  // 球员标志性年代（用于夕阳红/青春风暴彩蛋）
  var PLAYER_ERA = {};
  (function buildEra() {
    var teams = window.TEAMS || {};
    for (var tn in teams) if (teams.hasOwnProperty(tn)) {
      var decades = teams[tn].players || {};
      for (var dc in decades) if (decades.hasOwnProperty(dc)) {
        var plist = decades[dc] || [];
        for (var i = 0; i < plist.length; i++) {
          PLAYER_ERA[plist[i].name] = dc;
        }
      }
    }
  })();

  function getSynergies(players, coach) {
    // 用 Set 加速精确等值匹配
    var playerSet = {};
    players.forEach(function (p) { if (p && p.name) playerSet[p.name] = true; });
    var coachName = coach && coach.name ? coach.name : '';
    var hits = [];
    SYNERGIES.forEach(function (syn) {
      // 统计命中的关键字（精确等值匹配；同一全名只算 1 个）
      var hitKeys = {};
      syn.need.forEach(function (key) {
        if (playerSet[key]) hitKeys[key] = true;
      });
      var cnt = Object.keys(hitKeys).length;
      var coachHit = false;
      if (syn.coachNeed) {
        syn.coachNeed.forEach(function (key) {
          if (coachName === key) coachHit = true;
        });
      }
      var total = cnt + (coachHit ? 1 : 0);
      if (total >= syn.min) {
        hits.push({ id: syn.id, name: syn.name, bonus: syn.bonus, desc: syn.desc });
      }
    });
    // 叠加上限：避免堆满羁绊直接破坏难度，总加成最多 +8 胜
    var totalBonus = 0;
    hits.forEach(function (h) { totalBonus += h.bonus; });
    var capped = false;
    if (totalBonus > 8) { totalBonus = 8; capped = true; }
    return { hits: hits, totalBonus: totalBonus, capped: capped };
  }

  // 找出一支队伍里实际有球员的年代
  function decadesOfTeam(team) {
    return Object.keys(window.TEAMS[team].players);
  }
  // 随机抽一个「队伍 + 该队拥有的年代」组合
  function drawCombo(excludeTeam, fixedDecade) {
    var team = excludeTeam ? rand(TEAM_NAMES.filter(function (t) { return t !== excludeTeam; })) : rand(TEAM_NAMES);
    var ds = decadesOfTeam(team);
    var decade = fixedDecade && ds.indexOf(fixedDecade) >= 0 ? fixedDecade : rand(ds);
    return { team: team, decade: decade, candidates: window.TEAMS[team].players[decade] };
  }

    // 虚拟增长规则：以 2026-06-25T20:00:00+08:00（今天）为基准，每半小时自动增加 487 人。
    // 增长量叠加在云端真实值之上，从当前数值自然递增。
    var STAT_BASE_TIME = new Date('2026-06-25T20:00:00+08:00').getTime();
    var STAT_INCREMENT_PER_HALF_HOUR = 487;
    var HALF_HOUR_MS = 30 * 60 * 1000;
    function getTimeBasedIncrement() {
      return Math.floor((Date.now() - STAT_BASE_TIME) / HALF_HOUR_MS) * STAT_INCREMENT_PER_HALF_HOUR;
    }
    var _cloudBase = 0;
    function refreshStatDisplay() {
      var total = _cloudBase + getTimeBasedIncrement();
      if (statEl) statEl.textContent = formatNum(total);
    }
    var statEl = s.querySelector('#statNum');
    animateCount(statEl, getParticipants());
    fetchCloudCount(function (n) {
      if (typeof n === 'number') {
        _cloudBase = n;
        try { localStorage.setItem('np_plays_cloud', String(n)); } catch (e) {}
        animateCount(statEl, _cloudBase + getTimeBasedIncrement());
        // 每分钟刷新，确保跨过半小时边界时数字自动跳涨
        setInterval(refreshStatDisplay, 60000);
      }
    });
  }

  // 拉取云端累计参与人数
  function fetchCloudCount(cb) {
    fetch(CLOUD_COUNTER_URL + '?action=get')
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.code === 0) cb(d.count); })
      .catch(function () {});
  }

  // 云端累计 +1（点击开战时调用），成功后回调返回最新值
  function incCloudCount(cb) {
    fetch(CLOUD_COUNTER_URL + '?action=inc')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.code === 0) {
          try { localStorage.setItem('np_plays_cloud', String(d.count)); } catch (e) {}
          if (cb) cb(d.count);
        }
      })
      .catch(function () {});
  }
  function formatNum(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function animateCount(node, target) {
    if (!node) return;
    // 起点：优先取节点当前已显示的数字（让占位值→云端值平滑过渡，不会倒数）；
    // 首次（当前为 0/空）时从一个略低的值滚动上来，制造数字跳动效果。
    var cur = parseInt(String(node.textContent || '').replace(/[^\d]/g, ''), 10);
    var start;
    if (!isNaN(cur) && cur > 0 && cur <= target) {
      start = cur;
    } else {
      start = Math.max(0, target - 1800 - Math.floor(Math.random() * 1200));
    }
    var dur = 1100, t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / dur);
      var ease = 1 - Math.pow(1 - k, 3);
      node.textContent = formatNum(Math.round(start + (target - start) * ease));
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function buildLineupBoard(context) {

  function hasPositionChange(fromPos, player) {
    if (!player || !player.pos || player.pos.length <= 1) return false;
    return player.pos.some(function (toPos) {
      if (toPos === fromPos) return false;
      var target = state.lineup[toPos];
      return !target || canPlay(target, fromPos);
    });
  }

  function buildSlot(pos, context) {
    var p = state.lineup[pos];
    var slot = el('<div class="slot ' + pos.toLowerCase() + '"></div>');

      slot.classList.add('filled');

        (tierTag(p.tier) ? '<span class="tier-badge">' + tierTag(p.tier) + '</span>' : '') +

        '<div class="p-stat">' + p.pts + '/' + p.reb + '/' + p.ast + '</div>' +
        '<div class="p-team">' + p._team + '·' + p._decade + '</div>' +
        (movable ? '<div class="p-move">点按换位</div>' : '');
      if (movable) slot.onclick = function () { showPositionAdjust(pos, context); };
    } else {
      slot.innerHTML = '<div class="pos-label">' + pos + '</div>';
    }
    return slot;

  function updateSwapButtons() {
    var bt = document.getElementById('swap-team');
    var bd = document.getElementById('swap-decade');
    if (!bt || !bd) return;
    var hasDraw = !!state.currentDraw;
    bt.disabled = !hasDraw;

  function doSwap(type) {
    var combo;
    if (type === 'team') {
      // 换球队：年代保持不变，只在「拥有当前年代」的其他球队里随机
      var curDecade = state.currentDraw.decade;
      var pool = TEAM_NAMES.filter(function (t) {
        return t !== state.currentDraw.team && decadesOfTeam(t).indexOf(curDecade) >= 0;
      });
      if (!pool.length) { toast('没有其它球队拥有 ' + curDecade + ' 年代，无法换队'); return; }
      var nt = rand(pool);
      combo = { team: nt, decade: curDecade, candidates: window.TEAMS[nt].players[curDecade] };
    } else {
      // 换年代：球队保持不变，只换该队的其它年代
      var ds = decadesOfTeam(state.currentDraw.team).filter(function (d) { return d !== state.currentDraw.decade; });
      if (!ds.length) { toast('该球队只有 ' + state.currentDraw.decade + ' 一个年代，无法换年代'); return; }
      var nd = rand(ds);
      combo = { team: state.currentDraw.team, decade: nd, candidates: window.TEAMS[state.currentDraw.team].players[nd] };
    }
    animateSlot(combo, function () {
      state.currentDraw = combo;
      updateSwapButtons();
      toast(type === 'team' ? '已更换球队（可无限更换）' : '已更换年代（可无限更换）');
      renderPicker();
    });

  // 通用垂直滚动抽取转盘：条带从上往下滚动，缓动到最终结果居中停下（丝滑上下滚动）
  var CELL_H = 44; // 与 .reel-cell 高度保持一致（容器 48 - 上下边框 2*2 = 44 内容区）
  function spinReel(machine, pool, finalText, dur, done) {
    // 清空容器（移除上一轮定格的文本/条带），重新建立滚动条带
    machine.innerHTML = '';
    var strip = document.createElement('div'); strip.className = 'reel-strip'; machine.appendChild(strip);
    // 构建条带：N 个随机过渡项 + 最后一项为最终结果
    var N = 24;
    var html = '';
    for (var k = 0; k < N; k++) html += '<div class="reel-cell">' + rand(pool) + '</div>';
    html += '<div class="reel-cell">' + finalText + '</div>';
    strip.innerHTML = html;
    var total = N; // 需要滚动经过的格子数（最后一格为终点）
    var distance = total * CELL_H; // 终点条带位移
    var start = null;
    strip.style.transform = 'translateY(0)';
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var y = -distance * easeOutCubic(p);
      strip.style.transform = 'translateY(' + y + 'px)';
      if (p < 1) {
        requestAnimationFrame(step);
      } else {
        // 收尾：移除滚动条带，直接把最终结果作为容器子节点，
        // 由 .slot-machine 自身的 flex 居中，确保文字精确垂直居中（不再依赖条带定位）
        strip.parentNode.removeChild(strip);
        machine.appendChild(el('<span class="reel-final">' + finalText + '</span>'));
        done && done();
      }
    }
    requestAnimationFrame(step);
  }

  function animateSlot(finalCombo, done) {
    var mt = document.getElementById('m-team');
    var md = document.getElementById('m-decade');
    var pending = 2;
    function fin() { if (--pending === 0) done && done(); }
    // 年代略快、球队略慢，制造先后定格的层次感
    spinReel(md, window.DECADES, finalCombo.decade, 1100, fin);
    spinReel(mt, TEAM_NAMES, finalCombo.team, 1450, fin);
  }

  /* ============================================================
   * 球员候选列表
   * ============================================================ */
  function renderPicker() {
    var wrap = document.getElementById('picker');
    var c = state.currentDraw;
    wrap.innerHTML = '<div class="picker-title">选择你的球员 <small>' + c.team + ' · ' + c.decade + '</small></div>';

    // 前场 / 后场筛选 tab
    var tabRow = el('<div class="pos-tabs"></div>');
    [
      { key: 'all', label: '全部' },
      { key: 'back', label: '后场' },
      { key: 'front', label: '前场' },
    ].forEach(function (t) {
      var tab = el('<button class="pos-tab' + (state.posFilter === t.key ? ' active' : '') + '">' + t.label + '</button>');
      tab.onclick = function () {
        if (state.posFilter === t.key) return;
        state.posFilter = t.key;

      };

    });

  }

  // 是否匹配当前筛选（球员只要有一个可打位置落在所选范围即展示）
  function matchPosFilter(p) {
    if (state.posFilter === 'all') return true;
    var set = state.posFilter === 'front' ? FRONT_POS : BACK_POS;
    return p.pos.some(function (x) { return set.indexOf(x) >= 0; });
  }

  function renderPlayerCards(list) {
    var c = state.currentDraw;
    var shown = c.candidates.filter(matchPosFilter);
    list.innerHTML = '';
    if (!shown.length) {
      list.appendChild(el('<div class="board-tip" style="padding:18px 0">该组合下没有符合「' +
        (state.posFilter === 'front' ? '前场' : '后场') + '」的球员，试试其它筛选</div>'));
      return;
    }
    shown.forEach(function (p) {
      var picked = isPlayerInLineup(p.name);
      var card = el('<div class="player-card ' + (p.tier === 'legend' ? 'legend' : p.tier === 'tier2' ? 'tier2' : '') + (picked ? ' picked' : '') + '"></div>');
      var posPills = p.pos.map(function (x) { return '<span class="pos-pill">' + x + '</span>'; }).join('');
      card.innerHTML =
        '<div><div class="pc-name">' + tierTag(p.tier) + p.name + (picked ? ' <span class="picked-tag">已在阵容</span>' : '') + '</div>' +
        '<div class="pc-pos" style="margin-top:6px">' + posPills + '</div></div>' +
        '<div class="pc-meta"><div class="pc-stat">' + p.pts + ' / ' + p.reb + ' / ' + p.ast + '</div>' +
        '<div class="pc-team">得分/篮板/助攻</div></div>';
      card.onclick = function () { choosePlayer(p); };
      list.appendChild(card);
    });

  // 阵容中是否已有同名球员
  function isPlayerInLineup(name) {
    return Object.keys(state.lineup).some(function (k) {
      return state.lineup[k] && state.lineup[k].name === name;
    });
  }

  // 选了球员 -> 选位置 -> 填入阵容
  function choosePlayer(p) {
    if (isPlayerInLineup(p.name)) {
      toast(p.name + ' 已在你的阵容中，不能重复选择');
      return;
    }
    var player = Object.assign({}, p, { _team: state.currentDraw.team, _decade: state.currentDraw.decade, _id: Date.now() + Math.random() });
    askPosition(player, player.pos);
  }

  function canPlay(player, pos) {
    return player && player.pos && player.pos.indexOf(pos) >= 0;
  }

  function refreshAfterPositionChange(context) {
    if (context === 'coach') renderCoachPick();
    else renderDraft();
  }

  function showPositionAdjust(fromPos, context) {
    var player = state.lineup[fromPos];
    if (!player) return;
    if (!hasPositionChange(fromPos, player)) {
      toast(player.name + ' 当前没有可调整的位置');
      return;
    }

    var mask = el('<div class="modal-mask"></div>');
    var m = el('<div class="modal"></div>');
    m.innerHTML = '<h3>调整位置</h3>' +
      '<div style="text-align:center;color:#1a1d29;margin-bottom:16px">' + player.name + ' 当前在 ' + fromPos + '，可调整到：</div>';

    player.pos.filter(function (pos) { return pos !== fromPos; }).forEach(function (toPos) {
      var target = state.lineup[toPos];
      var canMove = !target;
      var canSwap = target && canPlay(target, fromPos);
      var label = toPos + ' ' + POS_NAME[toPos] + (target ? '（与 ' + target.name + ' 互换）' : '（空缺）');
      var btn = el('<button class="btn ' + (canMove || canSwap ? 'btn-primary' : 'btn-ghost') + '" style="margin-bottom:10px"' + (canMove || canSwap ? '' : ' disabled') + '>' + label + '</button>');
      btn.onclick = function () {
        if (!canMove && !canSwap) return;
        if (canMove) {
          delete state.lineup[fromPos];
          state.lineup[toPos] = player;
          toast(player.name + ' 已调整到 ' + toPos);
        } else {
          state.lineup[fromPos] = target;
          state.lineup[toPos] = player;
          toast(player.name + ' 与 ' + target.name + ' 已互换位置');
        }
        mask.remove();
        refreshAfterPositionChange(context);
      };
      m.appendChild(btn);
    });

    var cancel = el('<button class="btn btn-ghost" style="margin:0">取消</button>');
    cancel.onclick = function () { mask.remove(); };
    m.appendChild(cancel);
    mask.appendChild(m);
    mask.onclick = function (e) { if (e.target === mask) mask.remove(); };
    document.body.appendChild(mask);
  }

  function askPosition(player, allowedPos) {
    // 新选球员仍只允许放入空缺位置；已选球员可在阵容板点按换位
    var freePos = allowedPos.filter(function (pos) { return !state.lineup[pos]; });
    if (!freePos.length) {
      toast(player.name + ' 能打的位置（' + allowedPos.join('、') + '）已被占满，可先调整已选球员位置');
      return;
    }
    var mask = el('<div class="modal-mask"></div>');
    var m = el('<div class="modal"></div>');
    m.innerHTML = '<h3>安排上场位置</h3>' +
      '<div style="text-align:center;color:#1a1d29;margin-bottom:16px">' + player.name + ' 可担任：</div>';
    freePos.forEach(function (pos) {
      var btn = el('<button class="btn btn-primary" style="margin-bottom:10px">' +
        pos + ' ' + POS_NAME[pos] + '（空缺）</button>');
      btn.onclick = function () {
        mask.remove();
        placePlayer(player, pos);
      };
      m.appendChild(btn);
    });
    var cancel = el('<button class="btn btn-ghost" style="margin:0">取消</button>');
    cancel.onclick = function () { mask.remove(); };
    m.appendChild(cancel);
    mask.appendChild(m);
    mask.onclick = function (e) { if (e.target === mask) mask.remove(); };
    document.body.appendChild(mask);
  }

  function placePlayer(player, pos) {
    state.lineup[pos] = player;
    toast('已加入 ' + pos);
    nextRound();
  }

  /* ============================================================
   * 页面 2.5：选主教练（5 名球员选满后）
   * 采用与球员一致的「随机抽球队 + 年代」机制：
   * 抽出一个「有名帅的球队·年代」组合，展示该组合下的真实主帅候选，
   * 用户从中挑选一名；不满意可「重新抽取」换一个组合。
   * ============================================================ */
  // 有教练数据的「球队·年代」组合
  function coachCombos() {
    var seen = {}, list = [];
    window.COACHES.forEach(function (c) {
      var key = c.team + '|' + c.decade;
      if (!seen[key]) { seen[key] = true; list.push({ team: c.team, decade: c.decade }); }
    });
    return list;
  }
  function coachesOf(team, decade) {
    return window.COACHES.filter(function (c) { return c.team === team && c.decade === decade; });
  }
  // 随机抽一个教练「球队·年代」组合（可排除当前组合，避免重抽到同一个）
  function drawCoachCombo(exclude) {
    var combos = coachCombos();
    if (exclude && combos.length > 1) {
      combos = combos.filter(function (x) { return (x.team + '|' + x.decade) !== exclude; });
    }
    return rand(combos);
  }

    setTacticMode(false);
    root.innerHTML = '';

      '<div class="slot-box"><div class="label">年代</div><div class="slot-machine" id="cm-decade"><div class="reel-strip"><div class="reel-cell">???</div></div></div></div>';

  function renderCoachAction() {
    var wrap = document.getElementById('coach-action');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (!state.coachDraw) {
      var roll = el('<button class="btn btn-primary" style="margin:0">🎰 选取主教练</button>');
      roll.onclick = function () { rollCoach(false); };
      wrap.appendChild(roll);

      wrap.appendChild(el('<div style="text-align:center;color:var(--text-2);font-size:13px;padding:6px">已抽到组合，请在下方挑选主教练 👇</div>'));
      var reroll = el('<button class="tool-btn" style="margin-top:10px;width:100%">🔁 不满意，重新抽取（无限次）</button>');
      reroll.onclick = function () { rollCoach(true); };
      wrap.appendChild(reroll);
    }
  }

  function rollCoach(isReroll) {
    var exclude = isReroll && state.coachDraw ? (state.coachDraw.team + '|' + state.coachDraw.decade) : null;
    var combo = drawCoachCombo(exclude);
    animateCoachSlot(combo, function () {
      state.coachDraw = combo;
      renderCoachAction();
      renderCoachPicker();
    });
  }

  function animateCoachSlot(finalCombo, done) {
    var mt = document.getElementById('cm-team');
    var md = document.getElementById('cm-decade');
    var pending = 2;
    function fin() { if (--pending === 0) done && done(); }
    spinReel(md, window.DECADES, finalCombo.decade, 1100, fin);
    spinReel(mt, TEAM_NAMES, finalCombo.team, 1450, fin);
  }

  function getTacticEffect(tactic, ctx) {
    if (!tactic) return { tactic: null, mul: 1, text: '未选择主打战术。' };
    var players = ctx.players;
    var pts = ctx.totalPts, reb = ctx.totalReb, ast = ctx.totalAst;
    var legendCnt = ctx.legendCnt, tier2Cnt = ctx.tier2Cnt, roleCnt = ctx.roleCnt, coreLoad = ctx.coreLoad;
    var highScorers = players.filter(function (p) { return p.pts >= 20; }).length;
    var passers = players.filter(function (p) { return p.ast >= 5; }).length;
    var bigSlots = ['C', 'PF'].filter(function (pos) { return !!state.lineup[pos]; }).length;
    var backSlots = ['PG', 'SG'].filter(function (pos) { return !!state.lineup[pos]; }).length;
    var wingSlots = ['SG', 'SF', 'PF'].filter(function (pos) { return !!state.lineup[pos]; }).length;
    var delta = 0;
    var note = '';

    switch (tactic.id) {
      case 'seven':
        if (pts >= 100) delta += 0.025;
        if (ast >= 28) delta += 0.020;
        if (reb < 34) delta -= 0.020;
        note = '提速后更吃得分和传导，篮板保护差会被反击惩罚。';
        break;
      case 'iron':
        if (reb >= 40) delta += 0.030;
        if (bigSlots >= 2) delta += 0.015;
        if (pts < 88) delta -= 0.025;
        note = '防守和篮板越硬越赚，进攻太贫会拖慢胜场。';
        break;
      case 'iso':
        if (legendCnt + tier2Cnt >= 2) delta += 0.035;
        if (highScorers >= 2) delta += 0.015;
        if (roleCnt === 0) delta -= 0.030;
        if (ast < 22) delta -= 0.015;
        note = '关键球交给超巨，但球权和角色拼图不足会有内耗。';
        break;
      case 'team':
        if (ast >= 30) delta += 0.035;
        if (roleCnt >= 2) delta += 0.020;
        if (legendCnt >= 3) delta -= 0.020;
        note = '人人有球的体系，助攻和角色球员越多越稳定。';
        break;
      case 'fiveout':
        if (wingSlots + backSlots >= 4) delta += 0.025;
        if (ast >= 26) delta += 0.015;
        if (bigSlots >= 2 && ast < 26) delta -= 0.025;
        note = '空间越开越强，双塔或传导不足会拖节奏。';
        break;
      case 'twin':
        if (bigSlots >= 2) delta += 0.030;
        if (reb >= 40) delta += 0.020;
        if (backSlots < 2 || ast < 22) delta -= 0.025;
        note = '内线优势能碾压禁区，但后场组织不够会被夹击。';
        break;
      case 'princeton':
        if (ast >= 30) delta += 0.035;
        if (passers >= 3) delta += 0.020;
        if (coreLoad > 3) delta -= 0.020;
        note = '高位策应、空切和反跑很吃传球点数量。';
        break;
      case 'horns':
        if (state.lineup.PG && state.lineup.PF && state.lineup.C) delta += 0.030;
        if (ast >= 26) delta += 0.015;
        if (!state.lineup.PG) delta -= 0.030;
        note = '牛角站位需要控卫和双肘区发起点，挡拆质量决定收益。';
        break;
      case 'diamond':
        if ((state.lineup.SG && state.lineup.SG.pts >= 18) || (state.lineup.SF && state.lineup.SF.pts >= 18)) delta += 0.030;
        if (ast >= 24) delta += 0.015;
        if (highScorers < 2) delta -= 0.020;
        note = '钻石落位专门喂外线终结点，缺少射手会打不出来。';
        break;
      case 'triangle':
        if (highScorers >= 2) delta += 0.025;
        if (ast >= 24 && reb >= 34) delta += 0.020;
        if (roleCnt === 0) delta -= 0.015;
        note = '三角进攻讲究强弱侧平衡，双核和策应点越稳越好。';
        break;
      case 'elevator':
        if ((state.lineup.SG && state.lineup.SG.pts >= 18) || (state.lineup.SF && state.lineup.SF.pts >= 18)) delta += 0.025;
        if (passers >= 2) delta += 0.020;
        if (reb < 32) delta -= 0.015;
        note = '电梯门掩护适合射手爆发，篮板太弱会丢回合。';
        break;
      case 'zone':
        if (reb >= 36) delta += 0.025;
        if (wingSlots >= 3) delta += 0.015;
        if (pts < 85) delta -= 0.020;
        note = '区域联防能保护短板，但进攻太弱会守得住也赢不多。';
        break;
    }
    delta = Math.max(-0.055, Math.min(0.060, delta));
    return { tactic: tactic, mul: 1 + delta, delta: delta, text: note };
  }

  /* ============================================================
   * 模拟引擎：根据阵容算出 0-82 胜
   * ============================================================ */
  function runSimulation() {
    var players = POSITIONS.map(function (pos) { return state.lineup[pos]; }).filter(Boolean);
    // 必须选满 5 名球员、占满 5 个位置才能开始
    if (players.length < TOTAL_ROUNDS) {
      var miss = POSITIONS.filter(function (pos) { return !state.lineup[pos]; });
      toast('必须选满 5 名球员才能开始，还差：' + miss.join('、'));
      // 回到选秀页继续补齐
      state.currentDraw = null;
      renderDraft();
      return;
    }
    // 必须先选主教练和主打战术
    if (!state.coach) { renderCoachPick(); return; }
    if (!state.tactic) { renderTacticPick(); return; }

    var totalPts = 0, totalReb = 0, totalAst = 0;
    players.forEach(function (p) { totalPts += p.pts; totalReb += p.reb; totalAst += p.ast; });

    // 基础强度：得分权重最高，篮板助攻为辅
    var raw = totalPts * 1.0 + totalReb * 0.8 + totalAst * 0.9;

    // 均衡度惩罚：篮板/助攻不足会扣分，但不再把顶级天赋阵容直接打成中游队
    var balance = 1;
    if (totalReb < 34) balance -= (34 - totalReb) * 0.018;
    if (totalAst < 22) balance -= (22 - totalAst) * 0.018;
    balance = Math.max(0.72, balance);

    // 球权/化学反应：巨星(legend)是球权黑洞，顶级球星(tier2)同样占球权，过多会内耗；需要角色球员(role)做拼图
    var legendCnt = players.filter(function (p) { return p.tier === 'legend'; }).length;
    var tier2Cnt = players.filter(function (p) { return p.tier === 'tier2'; }).length;
    var starCnt = players.filter(function (p) { return p.tier === 'star'; }).length;
    var roleCnt = players.filter(function (p) { return p.tier === 'role'; }).length;
    // 高球权核心数：超巨权重 1，顶级球星权重 0.6
    var coreLoad = legendCnt + tier2Cnt * 0.6;

    // 巨星内耗：高球权核心超过 2，每多一个递增扣减球权（适度惩罚）
    var chem = 1;
    if (coreLoad > 2) chem -= (coreLoad - 2) * 0.065;
    // 完全没有角色球员（全明星+巨星堆）再扣，篮球需要拼图
    if (roleCnt === 0) chem -= 0.05;
    // 理想结构：1-2 核心 + 拼图角色，给一点加成
    if (coreLoad >= 1 && coreLoad <= 2 && roleCnt >= 1) chem += 0.04;

    // 主教练加成：boost 直接乘强度；disc 决定能化解多少巨星内耗
    var coach = state.coach;
    // disc 越高，越能把 chem 的负面部分往 1 拉回（化解能力下调，名帅也救不全）
    if (chem < 1) { chem = 1 - (1 - chem) * (1 - coach.disc * 0.4); }
    chem = Math.max(0.72, chem);

    var score = raw * balance * chem * coach.boost;
    var tacticEffect = getTacticEffect(state.tactic, {
      players: players, totalPts: totalPts, totalReb: totalReb, totalAst: totalAst,
      legendCnt: legendCnt, tier2Cnt: tier2Cnt, starCnt: starCnt, roleCnt: roleCnt,
      coreLoad: coreLoad,
    });
    score *= tacticEffect.mul;

    // 非线性映射到 0-82 胜：S 曲线。随机阵多落在中下游，75+ 需要真正顶配神阵。
    // 再抬高高胜场门槛：顶配阵容也卡在 73 左右，要 75+ 必须接近满配神阵。
    var x = (score - 41) / 126;
    x = Math.max(0, Math.min(1.5, x));
    // 赛季波动：同一套阵容每次有伤病/状态起伏，避免确定性满胜
    var luck = (Math.random() - 0.5) * 0.030;
    // 中心点 0.66、斜率 6.6：进一步压 75+ 门槛，顶级阵容仍保留冲 80+ 的上限
    var winRatio = 1 / (1 + Math.exp(-(6.6 * (x - 0.66) + luck * 4.2)));
    var wins = Math.round(winRatio * 82);
    // 82-0 是极限成就：只有近乎满配的均衡神阵才有微小概率打出完美赛季
    if (winRatio >= 0.992) {
      var perfectChance = Math.min(0.20, (winRatio - 0.992) / 0.025);
      wins = Math.random() < perfectChance ? 82 : 81;
    } else if (wins >= 82) {
      wins = 81;
    }

    // 王朝羁绊：抽到历史经典组合给额外胜场（在曲线之后叠加，便于直观展示 +N 胜）
    var synergy = getSynergies(players, state.coach);
    if (synergy.totalBonus > 0) {
      wins += synergy.totalBonus;
    }

    // 球队徽章：曼巴精神 / 顶级化学反应 等额外奖章
    var badges = [];
    var hasKobe = players.some(function (p) { return (p.name || '').indexOf('科比') >= 0; });
    if (hasKobe) {
      // 曼巴精神：阵容里有科比，关键球永不手软，胜场 +2
      wins += 2;
      badges.push({
        id: 'mamba', name: '曼巴精神', tag: 'MAMBA', tone: 'gold',
        desc: '科比坐镇，关键球永不手软，球队多赢 2 场硬仗。',
      });
    }

    wins = Math.max(6, Math.min(82, wins));

    // 顶级化学反应：超巨数 ≤ 1 但仍打出高胜（≥65 胜），是体系篮球的体现
    // 注意：放在裁切之后，确保 wins 是最终展示值
    if (legendCnt <= 1 && wins >= 65) {
      badges.push({
        id: 'chemistry', name: '顶级化学反应', tag: 'TEAM', tone: 'blue',
        desc: '没有堆超巨，靠传切、防守与角色拼图打出 ' + wins + ' 胜，体系篮球的范本。',
      });
    }

    // 巨星内耗：核心负荷过高（超巨堆叠 / 多个顶级球星 + 缺角色球员），最经典的"堆星反噬"
    // coreLoad = legendCnt + tier2Cnt*0.6，>= 4 时触发（典型如 4 超巨、3 超巨+1 全明星都不算）
    if (coreLoad >= 4) {
      badges.push({
        id: 'overload', name: '巨星内耗', tag: 'CHAOS', tone: 'red',
        desc: '核心负荷 ' + coreLoad.toFixed(1) + '（' + legendCnt + ' 超巨 + ' + tier2Cnt + ' 顶级球星），球权严重冲突' +
              (roleCnt === 0 ? '、又没有角色拼图' : '') +
              '，再好的名帅也救不全这种堆星阵容。',
      });
    }

    // ======== 彩蛋系统：隐藏成就 ========
    var chinaCount = 0;
    players.forEach(function (p) {
      var n = p.name || '';
      if (n === '姚明' || n === '易建联' || n === '王治郅' || n === '巴特尔' ||
          n === '周琦' || n === '杨瀚森' || n === '孙悦' || n === '崔永熙' || n === '李凯尔') chinaCount++;
    });

    // —— 长城不倒：≥3 中国球员保底65胜 ——
    if (chinaCount >= 3) {
      if (wins < 65) { wins = 65; }
      badges.push({ id: 'greatwall3', name: '长城不倒', tag: '🇨🇳', tone: 'red',
        desc: chinaCount + '位中国球员同队！东方力量席卷联盟！保底65胜。' });
    }

    // —— 死亡五小：5人平均身高≤200cm ——
    var totalH = 0, hCnt = 0;
    players.forEach(function (p) {
      var h = PLAYER_HEIGHT[p.name];
      if (h && h > 0) { totalH += h; hCnt++; }
    });
    if (hCnt === 5 && totalH / hCnt <= 200) {
      wins += 3;
      badges.push({ id: 'deathfive', name: '死亡五小', tag: '⚡', tone: 'purple',
        desc: '全员平均身高仅 ' + Math.round(totalH / hCnt) + 'cm，极致空间拉满，对手中锋被拉到三分线怀疑人生。' });
    }

    // —— 夕阳红战队：全部来自1990s及更早 ——
    var oldEraCnt = 0, youngEraCnt = 0;
    players.forEach(function (p) {
      var era = PLAYER_ERA[p.name] || '';
      if (era === '1980s' || era === '1990s') oldEraCnt++;
      else if (era === '2020s') youngEraCnt++;
    });
    if (oldEraCnt === 5) {
      wins += 2;
      badges.push({ id: 'goldenoldies', name: '夕阳红战队', tag: '👴', tone: 'bronze',
        desc: '老当益壮！这帮传奇老炮儿用经验教年轻人做人。' });
    }

    // —— 青春风暴：全部来自2020s ——
    if (youngEraCnt === 5) {
      wins += 2;
      badges.push({ id: 'youthquake', name: '青春风暴', tag: '👶', tone: 'cyan',
        desc: '联盟的未来就在这里，年轻就是最大的资本！' });
    }

    // 彩蛋可能改变胜场，最终裁切
    wins = Math.max(6, Math.min(82, wins));

    var losses = 82 - wins;

    renderResult({
      wins: wins, losses: losses, players: players, score: Math.round(score),
      totalPts: totalPts, totalReb: totalReb, totalAst: totalAst, balance: balance,
      legendCnt: legendCnt, tier2Cnt: tier2Cnt, starCnt: starCnt, roleCnt: roleCnt,
      tacticEffect: tacticEffect, synergy: synergy, badges: badges,
    });
  }

  /* ============================================================
   * 球队攻防评价：进攻看总得分，防守看篮板(禁区)+助攻(转换/串联)
   * 返回 { off:{lv,txt}, def:{lv,txt} }，lv 用于配色
   * ============================================================ */
  function teamRating(r) {
    var pts = r.totalPts || 0;
    var reb = r.totalReb || 0;
    var ast = r.totalAst || 0;
    // 防守强度：篮板为主(禁区护框/二次进攻)，助攻为辅(代表球的流动与协防意识)
    var defScore = reb + ast * 0.5;

    var off, def;
    // —— 进攻评价（按总得分分档）——
    if (pts >= 120) {
      off = { lv: 'sss', txt: '进攻火力拉满，五人开火没人防得住，回合效率联盟顶级。' };
    } else if (pts >= 100) {
      off = { lv: 'good', txt: '进攻很强，多点开花，关键球随便交给谁都能解决。' };
    } else if (pts >= 82) {
      off = { lv: 'mid', txt: '进攻中规中矩，能打但缺一个稳定的爆点。' };
    } else {
      off = { lv: 'bad', txt: '进攻偏弱，得分手段单一，遇到强队容易打铁打到怀疑人生。' };
    }
    // —— 防守评价（按篮板+助攻综合）——
    if (defScore >= 70) {
      def = { lv: 'sss', txt: '防守铁桶，篮板球全包圆，对手想要二次进攻先问问内线答不答应。' };
    } else if (defScore >= 56) {
      def = { lv: 'good', txt: '防守扎实，护框和拼抢都在线，能把对手的进攻拖进泥潭。' };
    } else if (defScore >= 44) {
      def = { lv: 'mid', txt: '防守一般，篮板能咬住，但对面突破分球还是会漏。' };
    } else {
      def = { lv: 'bad', txt: '防守是大漏勺，篮板被吊打，禁区跟不设防一样随便进。' };
    }
    return { off: off, def: def };
  }

  // 攻防评价配色
  var RATE_COLOR = { sss: '#ffd24d', good: '#2bd576', mid: '#8fb4ff', bad: '#ff5d5d' };

  /* ============================================================
   * 根据实际阵容情况生成个性化名人堂解说
   * 综合：战绩定调 + 攻防画像 + 球权结构 + 球星点名 + 教练 + 建议
   * ============================================================ */
  function buildCommentary(r) {
    var players = r.players || [];
    var topScorer = players.slice().sort(function (a, b) { return b.pts - a.pts; })[0];
    var reb = r.totalReb, ast = r.totalAst;
    var legendCnt = r.legendCnt || 0, tier2Cnt = r.tier2Cnt || 0, starCnt = r.starCnt || 0, roleCnt = r.roleCnt || 0;
    var core = safeName(topScorer);

    var parts = [];

    // 1) 战绩定调 —— 一句话点评
    if (r.wins === 82) {
      parts.push('82 胜 0 负，篮球世界最干净的一行数字，今天属于你。');
    } else if (r.wins >= 70) {
      parts.push(r.wins + ' 胜，公牛、勇士才摸到过的高度，这套阵容真吓人。');
    } else if (r.wins >= 58) {
      parts.push(r.wins + ' 胜，分区前排的硬货，季后赛也不怵谁。');
    } else if (r.wins >= 45) {
      parts.push(r.wins + ' 胜，季后赛稳了，想再往上还差一口气。');
    } else if (r.wins >= 30) {
      parts.push(r.wins + ' 胜，卡在附加赛边上，一脚门里一脚门外。');
    } else {
      parts.push(r.wins + ' 胜，磨合得很苦，这是支需要时间的球队。');
    }

    // 2) 一个最该说的点（短板优先；都不弱则点核心/教练），一句收尾
    if (reb < 34 && ast < 26) {
      parts.push('篮板（' + reb + '）和助攻（' + ast + '）都偏低，攻守都得硬扛。');
    } else if (reb < 34) {
      parts.push('软肋是篮板只有 ' + reb + '，禁区一松就被吃二次进攻。');
    } else if (ast < 26) {
      parts.push('球有点粘，全队助攻才 ' + ast + '，进攻还能更流畅。');
    } else if (state.coach && state.coach.tier === 'master') {
      parts.push('名帅' + state.coach.name + '坐镇帅位，把上限彻底点燃。');
    } else if (legendCnt + tier2Cnt >= 1) {
      parts.push(core + '挑大梁，攻守都立得住，是能打硬仗的样子。');
    } else {
      parts.push('靠团队篮球咬硬仗，这股劲儿值得一吹。');
    }

    return parts.join('');
  }

  /* ============================================================
   * 复盘点评：拆成三段「赢球原因 / 最大短板 / 提升建议」
   * 综合得分/篮板/助攻 + 球权结构 + 教练 + 战术 + 羁绊
   * ============================================================ */
  function buildAnalysis(r) {
    var players = r.players || [];
    var pts = r.totalPts || 0, reb = r.totalReb || 0, ast = r.totalAst || 0;
    var legendCnt = r.legendCnt || 0, tier2Cnt = r.tier2Cnt || 0, roleCnt = r.roleCnt || 0;
    var coreLoad = legendCnt + tier2Cnt * 0.6;
    var sorted = players.slice().sort(function (a, b) { return b.pts - a.pts; });
    var topScorer = sorted[0];
    var core = safeName(topScorer);
    var second = sorted[1] ? safeName(sorted[1]) : '';
    var coach = state.coach;
    var te = r.tacticEffect;
    var syn = r.synergy;
    var badges = r.badges || [];

    // —— 1) 赢球原因（找这套阵容最强的点）——
    var win;
    if (pts >= 120) {
      win = '进攻火力拉满，全队合计 ' + pts + ' 分，' + core + '领衔多点开火，谁防都防不住。';
    } else if (legendCnt >= 2) {
      win = core + (second ? ' + ' + second : '') + '两位超巨同时在场，关键球永远有人接管，硬仗不慌。';
    } else if (reb >= 42) {
      win = '内线统治力十足，全队 ' + reb + ' 篮板牢牢锁死禁区，二次进攻和防守篮板都是优势。';
    } else if (ast >= 30) {
      win = '球的流动极好，全队 ' + ast + ' 次助攻，人人有球、人人能投，体系篮球的样板。';
    } else if (coach && coach.tier === 'master') {
      win = '名帅' + coach.name + '坐镇，把这套阵容的化学反应和上限彻底点燃。';
    } else if (legendCnt + tier2Cnt >= 1) {
      win = core + '挑起大梁，攻守两端都立得住，是能打硬仗的核心。';
    } else {
      win = '没有绝对巨星，但靠团队篮球和拼劲咬住每一场，赢得很扎实。';
    }
    // 羁绊加成补一句
    if (syn && syn.hits && syn.hits.length) {
      win += '另外触发了' + syn.hits.map(function (h) { return h.name; }).join('、') + '，历史级默契额外帮你多赢了 ' + syn.totalBonus + ' 场。';
    }
    // 正向徽章补一句（红色负向徽章在"最大短板"里点名，避免混淆）
    var posBadges = badges.filter(function (b) { return b.tone !== 'red'; });
    if (posBadges.length) {
      win += '球队获得' + posBadges.map(function (b) { return '「' + b.name + '」' }).join('、') + '徽章。';
    }

    // —— 2) 最大短板（找最该补的洞）——
    var weak;
    if (coreLoad >= 4) {
      // 巨星内耗最优先（典型堆星反噬场景，直接点明）
      weak = '巨星内耗严重——' + legendCnt + ' 个超巨' + (tier2Cnt ? '加 ' + tier2Cnt + ' 个顶级球星' : '') +
        '同时在场，球权严重冲突' + (roleCnt === 0 ? '、又没有角色球员拉空间补防' : '') +
        '，化学反应被狠狠扣了一截，再好的教练也救不全。';
    } else if (reb < 32 && ast < 24) {
      weak = '篮板（' + reb + '）和助攻（' + ast + '）双低，禁区站不住、球也转不开，攻防两端都得硬扛。';
    } else if (reb < 32) {
      weak = '篮板只有 ' + reb + '，禁区偏软，遇到强力内线容易被吃二次进攻和打转换。';
    } else if (ast < 24) {
      weak = '全队助攻才 ' + ast + '，球有点粘，进攻过于依赖单打，遇到强防守容易卡壳。';
    } else if (coreLoad > 3) {
      weak = '球星太多（核心负荷偏高），球权分配是隐患，季后赛容易出现关键球该给谁的内耗。';
    } else if (roleCnt === 0) {
      weak = '清一色明星、没有角色拼图，缺少干脏活、拉空间、补防的人，常规赛稳定性会打折扣。';
    } else if (pts < 92) {
      weak = '进攻火力偏弱（合计 ' + pts + ' 分），缺一个能稳定自主得分的爆点，阵地战容易打不开。';
    } else if (coach && coach.tier === 'rookie') {
      weak = '主教练经验不足，临场调整和轮换是短板，好阵容没被完全用出来。';
    } else {
      weak = '没有明显硬伤，但也缺一个能瞬间改变战局的杀手锏，上限还差临门一脚。';
    }
    // 战术不适配补一句
    if (te && te.tactic && typeof te.delta === 'number' && te.delta < 0) {
      weak += '而且「' + te.tactic.name + '」和这套阵容不太对路，反而拖了后腿。';
    }

    // —— 3) 提升建议（针对短板给可操作方向）——
    var advice;
    if (coreLoad >= 4) {
      advice = '把 1-2 个超巨换成全明星或角色球员（拉空间/防守拼图），核心负荷降到 3 以内，化学反应会立刻顺过来；或选「巨星单打」明确战术核心。';
    } else if (reb < 32) {
      advice = '补一个篮板/护框型内线（高篮板的 C/PF），或改打「铁血防守 / 双塔禁区」稳住禁区。';
    } else if (ast < 24) {
      advice = '加一个高助攻控卫（PG）串联全队，或选「团队篮球 / 普林斯顿」让球转起来。';
    } else if (coreLoad > 3) {
      advice = '适当减少球权黑洞、补 1-2 名角色球员做拼图，或选「巨星单打」明确战术核心。';
    } else if (roleCnt === 0) {
      advice = '换掉一名明星、补一个能拉空间或补防的角色球员，化学反应会明显更顺。';
    } else if (pts < 92) {
      advice = '补一个能稳定自主得分的爆点（高得分的超巨/全明星），或改打「七秒进攻」提速要分。';
    } else if (te && te.tactic && typeof te.delta === 'number' && te.delta < 0) {
      advice = '换一个更适配的主打战术，把阵容长处发挥出来，胜场还能再上一个台阶。';
    } else if (r.wins < 70) {
      advice = '阵容已经不错，再追求顶配可以凑历史经典组合（如 OK 组合、宇宙勇）触发王朝羁绊冲高胜。';
    } else {
      advice = '这套已接近完美，保持攻防均衡，凑齐王朝羁绊 + 名帅 + 适配战术，就有机会冲击 82-0。';
    }

    return { win: win, weak: weak, advice: advice };
  }

  // 取球员名（去掉可能的 tier 前缀，安全兜底）
  function safeName(p) { return p && p.name ? p.name : '当家球星'; }

  /* ============================================================
   * 页面 3：结算
   * ============================================================ */
  function renderResult(r) {
    setTacticMode(false);
    root.innerHTML = '';
    var s = el('<div class="screen"></div>');

    var grade, gradeColor, title;
    if (r.wins === 82) {
      grade = '完美赛季'; gradeColor = '#ffd24d'; title = '🏆 82-0 完美赛季！载入史册！';
    } else if (r.wins >= 75) {
      grade = '夯爆了'; gradeColor = '#ff5d00'; title = '历史级王朝战绩，封神之作！';
    } else if (r.wins >= 70) {
      grade = '夯'; gradeColor = '#ff7200'; title = '历史级强队，冠军热门！';
    } else if (r.wins >= 58) {
      grade = '顶级'; gradeColor = '#2bd576'; title = '联盟顶级强队';
    } else if (r.wins >= 45) {
      grade = '人上人'; gradeColor = '#48b0ff'; title = '季后赛球队';
    } else if (r.wins >= 30) {
      grade = 'NPC'; gradeColor = '#aab4d4'; title = '中下游球队';
    } else {
      grade = '拉完了'; gradeColor = '#ff5d5d'; title = '重建中…';
    }
    // 攻防简评：进攻看总得分，防守看篮板（禁区防守）+助攻（攻防转换）
    var od = teamRating(r);
    // 根据实际阵容情况生成个性化解说
    var comment = buildCommentary(r);

    s.appendChild(el(
      '<div class="result-hero">' +
        '<div class="result-record">' + r.wins + '-' + r.losses + '</div>' +
        '<div class="result-grade" style="color:' + gradeColor + '">评级 ' + grade + '</div>' +
        '<div class="result-title">' + title + '</div>' +
      '</div>'
    ));

    // 进度条
    var prog = el('<div class="progress-wrap"></div>');
    prog.innerHTML =
      '<div class="progress-bar"><div class="progress-fill" style="width:0"></div></div>' +
      '<div class="progress-label"><span>0 胜</span><span>距离 82-0 完美赛季</span><span>82 胜</span></div>';
    s.appendChild(prog);

    // 球队徽章（曼巴精神 / 顶级化学反应 等）
    if (r.badges && r.badges.length) {
      var badgesHtml = r.badges.map(function (b) {
        return '<div class="badge badge-' + b.tone + '">' +
          '<div class="badge-head"><span class="badge-tag">' + b.tag + '</span>' +
          '<span class="badge-name">' + b.name + '</span></div>' +
          '<div class="badge-desc">' + b.desc + '</div>' +
        '</div>';
      }).join('');
      s.appendChild(el('<div class="result-badges">' + badgesHtml + '</div>'));
    }

    // 最终阵容
    s.appendChild(el('<div class="picker-title" style="margin-top:8px">你的首发阵容</div>'));
    var fl = el('<div class="final-lineup"></div>');
    POSITIONS.forEach(function (pos) {
      var p = r.players.find(function (x) { return Object.keys(state.lineup).find(function (k) { return state.lineup[k] === x && k === pos; }); });
      // 直接按 state.lineup 取
      p = state.lineup[pos];
      if (!p) return;
      fl.appendChild(el(
        '<div class="fl-item">' +
          '<span class="fl-pos">' + pos + '</span>' +
          '<span class="fl-name">' + tierTag(p.tier) + p.name + '</span>' +
          '<span class="fl-stat">' + p.pts + '/' + p.reb + '/' + p.ast + ' · ' + p._team + p._decade + '</span>' +
        '</div>'
      ));
    });
    s.appendChild(fl);

    // 主教练
    if (state.coach) {
      var c = state.coach;
      s.appendChild(el(
        '<div class="result-coach">' +
          '<div class="rc-left"><div class="rc-role">主教练</div>' +
          '<div class="rc-name">' + c.name + ' ' + coachTag(c.tier) + '</div>' +
          '<div class="rc-title">' + c.title + '</div></div>' +
        '</div>'
      ));
    }

    // 主打战术
    if (r.tacticEffect && r.tacticEffect.tactic) {
      var te = r.tacticEffect;
      var deltaText = te.delta > 0 ? '加成 +' + Math.round(te.delta * 100) + '%' : te.delta < 0 ? '修正 ' + Math.round(te.delta * 100) + '%' : '无明显修正';
      s.appendChild(el(
        '<div class="result-coach">' +
          '<div class="rc-left"><div class="rc-role">主打战术 · ' + deltaText + '</div>' +
          '<div class="rc-name">' + te.tactic.name + ' ' + tacticTag(te.tactic) + '</div>' +
          '<div class="rc-title">' + te.text + '</div></div>' +
        '</div>'
      ));
    }

    // 二维码（放在主打战术下方）
    var qrUrl2 = window.location.href.split('#')[0];
    var qrImgSrc2 = qrUrl2.indexOf('mat1.gtimg.com') > -1 || qrUrl2.indexOf('tcloudbaseapp') > -1 ? './assets/qrcode.png' : './assets/qrcode.png';
    s.appendChild(el(
      '<div class="qr-invite">' +
        '<div class="qr-left"><img class="qr-img" src="' + qrImgSrc2 + '" alt="扫码挑战"/><span class="qr-caption">扫码挑战82胜</span></div>' +
        '<div class="qr-right"><button class="btn-prize" onclick="window.open(\'https://kbsapp.sports.qq.com/subject/NBA82%e8%83%9c%e5%a4%a7%e6%8c%91%e6%88%98?shareKey=86V5GETN8JWM8G3L8WTM8FKR8SV5AF2&sharer=86V5GETN8JWM8G3L8WTM8FKR8SV5AF2\',\'_blank\')">🏆 晒战绩赢奖品</button></div>' +
      '</div>'
    ));

    // 触发羁绊（王朝组合加成）
    if (r.synergy && r.synergy.hits && r.synergy.hits.length) {
      var syn = r.synergy;
      var sumText = syn.hits.map(function (h) { return h.name + '+' + h.bonus + '胜'; }).join('，');
      var rows = syn.hits.map(function (h) {
        return '<div class="syn-row">' +
          '<span class="syn-name">' + h.name + '</span>' +
          '<span class="syn-bonus">+' + h.bonus + ' 胜</span>' +
          '<span class="syn-desc">' + h.desc + '</span>' +
        '</div>';
      }).join('');
      var capTip = syn.capped ? '<div class="syn-cap">羁绊加成已达上限，本场按 +' + syn.totalBonus + ' 胜结算</div>' : '';
      s.appendChild(el(
        '<div class="result-synergy">' +
          '<div class="syn-head"><span class="syn-title">🔗 触发王朝羁绊</span>' +
          '<span class="syn-total">合计 +' + syn.totalBonus + ' 胜</span></div>' +
          '<div class="syn-sum">' + sumText + '</div>' +
          '<div class="syn-list">' + rows + '</div>' + capTip +
        '</div>'
      ));
    }

    // 复盘点评：赢球原因 / 最大短板 / 提升建议 三段（放在按钮上方，紧接主打战术之后）
    var analysis = buildAnalysis(r);
    s.appendChild(el(
      '<div class="result-analysis">' +
        '<div class="ra-title">📋 赛季复盘</div>' +
        '<div class="ra-row ra-win">' +
          '<span class="ra-label">赢球原因</span>' +
          '<span class="ra-text">' + analysis.win + '</span>' +
        '</div>' +
        '<div class="ra-row ra-weak">' +
          '<span class="ra-label">最大短板</span>' +
          '<span class="ra-text">' + analysis.weak + '</span>' +
        '</div>' +
        '<div class="ra-row ra-advice">' +
          '<span class="ra-label">提升建议</span>' +
          '<span class="ra-text">' + analysis.advice + '</span>' +
        '</div>' +
      '</div>'
    ));

    // 按钮
    var again = el('<button class="btn btn-primary">🔄 再来一次</button>');
    var share = el('<button class="btn btn-secondary">📤 分享我的战绩</button>');
    again.onclick = startGame;
    share.onclick = function () { saveToRank(r); generateShareCard(r, grade, gradeColor, title, od, comment); };
    s.appendChild(again); s.appendChild(share);

    // 知名篮球评论员点评（放在页面最下方，随机一位署名）
    s.appendChild(el(commentary(comment, rand(COMMENTATORS))));

    // 品牌出品落款
    s.appendChild(el('<div class="brand-footer"><span class="brand-footer-icon" role="img" aria-label="腾讯体育"></span>· NBA王朝缔造者</div>'));

    root.appendChild(s);

    // 触发进度条动画
    setTimeout(function () {
      var fill = s.querySelector('.progress-fill');
      if (fill) fill.style.width = (r.wins / 82 * 100) + '%';
    }, 200);
  }

  /* ============================================================
   * 分享战绩卡片（Canvas 绘制竖版海报 + 预览弹层）
   * ============================================================ */
  function tierCardColor(tier) {
    return tier === 'legend' ? { bg: '#ffb13d', fg: '#3a2a00' }
      : tier === 'tier2' ? { bg: '#8a4ff2', fg: '#fff' }
      : tier === 'star' ? { bg: '#2f7bff', fg: '#fff' }
      : tier === 'mvp' ? { bg: '#ffd700', fg: '#3a2a00' }
      : null;
  }
  function coachCardColor(tier) {
    return tier === 'master' ? { bg: '#ffb13d', fg: '#3a2a00' }
      : tier === 'elite' ? { bg: '#8a4ff2', fg: '#fff' }
      : tier === 'solid' ? { bg: '#2bd576', fg: '#06301a' }
      : { bg: '#42506e', fg: '#fff' };
  }

  function generateShareCard(r, grade, gradeColor, title, od, comment) {
    toast('正在生成分享卡…');
    // 先加载腾讯体育官方 logo，加载完成（或失败）后再绘制，确保 logo 能画进卡片。
    // 关键：用 fetch 把本地 logo 读成 dataURL 再作为图片源——dataURL 图片画进 canvas
    // 绝不会污染（toDataURL 必定成功），彻底避免之前“画了 logo 后 toDataURL 抛
    // SecurityError → 回退 emoji 兜底”的问题。fetch 失败时再退回直接用文件路径。
    var logoImg = new Image();
    var logoReady = false;
    logoImg.onload = function () { logoReady = true; doDraw(true); };
    logoImg.onerror = function () { logoReady = false; doDraw(true); };
    fetch('./assets/tx-logo.png?v=20260623r')
      .then(function (resp) { return resp.blob(); })
      .then(function (blob) {
        var fr = new FileReader();
        fr.onload = function () { logoImg.src = fr.result; };       // dataURL，不污染 canvas
        fr.onerror = function () { logoImg.src = './assets/tx-logo.png?v=20260623r'; };
        fr.readAsDataURL(blob);
      })
      .catch(function () { logoImg.src = './assets/tx-logo.png?v=20260623r'; });

    // useLogo=false 时强制不画图片（纯文字降级版），用于 canvas 被污染时兜底重画
    function doDraw(useLogo) {
    var drawLogo = useLogo && logoImg.complete && logoImg.naturalWidth > 0;
    var W = 750, H = 1334;
    var dpr = 2;
    var cv = document.createElement('canvas');
    cv.width = W * dpr; cv.height = H * dpr;
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);

    // 圆角矩形工具
    function rr(x, y, w, h, rad) {
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    // 背景渐变（深蓝）
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0e1830');
    bg.addColorStop(0.5, '#0b1326');
    bg.addColorStop(1, '#070d1c');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var PAD = 48;
    var y = 0;

    // 顶部品牌条：红蓝双色圆球图标 + 腾讯体育 + 王朝缔造者
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    var brandX = PAD;
    if (drawLogo) {
      // tx-logo.png 是「圆球 + 大片透明」的宽图，圆球位于最左侧的正方形区域；
      // 用 9 参数 drawImage 仅截取左侧正方形（边长=图片高度）画成纯圆球图标
      var ballSrc = logoImg.height; // 圆球区域边长 ≈ 图片高度
      var ballD = 40;               // 目标绘制尺寸
      ctx.drawImage(logoImg, 0, 0, ballSrc, ballSrc, brandX, 60 - ballD / 2, ballD, ballD);
      brandX += ballD + 14;
      // 「腾讯体育」白色文字（圆球本身不含文字，这里补上品牌名）
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 30px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('腾讯体育', brandX, 60);
      brandX += ctx.measureText('腾讯体育').width + 14;
    } else {
      ctx.fillStyle = '#ff7200';
      ctx.font = '700 30px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('🏀 腾讯体育', brandX, 60);
      brandX += ctx.measureText('🏀 腾讯体育  ').width;
    }
    // 「NBA王朝缔造者」橙色斜体艺术字，呼应首页顶栏品牌风格
    ctx.fillStyle = '#ff8a2b';
    ctx.font = 'italic 900 30px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('NBA王朝缔造者', brandX, 60);

    // 战绩大字
    y = 175;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 110px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(r.wins + '-' + r.losses, W / 2, y);

    // 评级
    y = 270;
    ctx.fillStyle = gradeColor;
    ctx.font = '800 46px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText('评级 ' + grade, W / 2, y);

    // 标题
    y = 325;
    ctx.fillStyle = '#c9d4ee';
    ctx.font = '500 26px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(title, W / 2, y);

    // 进度条
    y = 380;
    var barX = PAD, barW = W - PAD * 2, barH = 14;
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    rr(barX, y, barW, barH, 7); ctx.fill();
    var pg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    pg.addColorStop(0, '#4f8bff'); pg.addColorStop(1, '#ff9b2f');
    ctx.fillStyle = pg;
    var pw = Math.max(barH, barW * (r.wins / 82));
    rr(barX, y, pw, barH, 7); ctx.fill();
    ctx.fillStyle = '#7f8db0';
    ctx.font = '500 20px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'left'; ctx.fillText('0 胜', barX, y + 38);
    ctx.textAlign = 'right'; ctx.fillText('82 胜', barX + barW, y + 38);
    ctx.textAlign = 'center'; ctx.fillStyle = '#9aa6c8';
    ctx.fillText('距离 82-0 完美赛季', W / 2, y + 38);

    // 首发阵容标题
    y = 470;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff7200';
    ctx.font = '800 30px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText('你的首发阵容', PAD, y);

    // 阵容行
    y = 510;
    var rowH = 78, rowGap = 12;
    POSITIONS.forEach(function (pos) {
      var p = state.lineup[pos];
      if (!p) return;
      // 行背景
      ctx.fillStyle = 'rgba(255,255,255,.045)';
      rr(PAD, y, W - PAD * 2, rowH, 14); ctx.fill();

      // 位置徽标
      ctx.fillStyle = 'rgba(124,92,255,.22)';
      rr(PAD + 16, y + 19, 56, 40, 10); ctx.fill();
      ctx.fillStyle = '#b9a7ff';
      ctx.font = '800 24px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(pos, PAD + 16 + 28, y + rowH / 2);

      var tx = PAD + 90;
      // tier 标签
      var tc = tierCardColor(p.tier);
      var lbl = tierLabel(p.tier);
      if (tc && lbl) {
        ctx.font = '800 20px -apple-system,"PingFang SC",sans-serif';
        var lw = ctx.measureText(lbl).width + 20;
        ctx.fillStyle = tc.bg;
        rr(tx, y + rowH / 2 - 16, lw, 32, 8); ctx.fill();
        ctx.fillStyle = tc.fg;
        ctx.textAlign = 'center';
        ctx.fillText(lbl, tx + lw / 2, y + rowH / 2);
        tx += lw + 12;
      }
      // 球员名
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 27px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(p.name, tx, y + rowH / 2);

      // 右侧数据
      ctx.fillStyle = '#ffd24d';
      ctx.font = '600 22px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(p.pts + '/' + p.reb + '/' + p.ast + ' · ' + p._team + p._decade, W - PAD - 16, y + rowH / 2);

      y += rowH + rowGap;
    });

    // 主教练
    if (state.coach) {
      var c = state.coach;
      var chH = 92;
      ctx.fillStyle = 'rgba(79,139,255,.10)';
      rr(PAD, y, W - PAD * 2, chH, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(79,139,255,.28)'; ctx.lineWidth = 1.5;
      rr(PAD, y, W - PAD * 2, chH, 14); ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#8fb4ff';
      ctx.font = '600 20px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText('主教练', PAD + 22, y + 28);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 28px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(c.name, PAD + 22, y + 62);
      var nw = ctx.measureText(c.name).width;
      var cc = coachCardColor(c.tier);
      var clbl = coachTierLabel(c.tier);
      ctx.font = '800 19px -apple-system,"PingFang SC",sans-serif';
      var clw = ctx.measureText(clbl).width + 18;
      ctx.fillStyle = cc.bg;
      rr(PAD + 22 + nw + 14, y + 48, clw, 28, 7); ctx.fill();
      ctx.fillStyle = cc.fg; ctx.textAlign = 'center';
      ctx.fillText(clbl, PAD + 22 + nw + 14 + clw / 2, y + 62);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff9b4d';
      ctx.font = '500 22px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(c.title, W - PAD - 22, y + 50);
      y += chH + 18;
    }

    // 底部落款：小号红蓝圆球图标 + 「腾讯体育 + 文字」，紧跟内容下方居中
    var footY = y + 56;
    var footTxt = '腾讯体育 · NBA王朝缔造者  |  快来挑战你的 82-0 完美赛季';
    ctx.font = '600 22px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = '#6b7796';
    ctx.textBaseline = 'middle';
    if (drawLogo) {
      var fBallSrc = logoImg.height;   // 圆球区域边长 ≈ 图片高度
      var fBallD = 26;                 // 落款圆球绘制尺寸
      var ftW = ctx.measureText(' ' + footTxt).width;
      var startX = (W - (fBallD + ftW)) / 2;
      ctx.drawImage(logoImg, 0, 0, fBallSrc, fBallSrc, startX, footY - fBallD / 2, fBallD, fBallD);
      ctx.textAlign = 'left';
      ctx.fillText(' ' + footTxt, startX + fBallD, footY);
    } else {
      ctx.textAlign = 'center';
      ctx.fillText('🏀 ' + footTxt, W / 2, footY);
    }

    // 内容实际高度（含落款下方留白），裁剪掉多余空白后再导出
    var realH = Math.min(H, Math.round(footY + 40));

    // 输出图片并弹层预览；若因图片污染导致导出失败，降级重画纯文字版再导出
    var url;
    try {
      // 裁剪到实际内容高度，避免删除攻防评价后底部出现大段空白
      var out = document.createElement('canvas');
      out.width = W * dpr; out.height = realH * dpr;
      out.getContext('2d').drawImage(cv, 0, 0, W * dpr, realH * dpr, 0, 0, W * dpr, realH * dpr);
      url = out.toDataURL('image/png');
    } catch (e) {
      if (useLogo) { doDraw(false); return; }
      toast('生成失败：' + e.message); return;
    }
    showShareModal(url);
    } // end doDraw
  }

  function showShareModal(url) {
    var old = document.querySelector('.share-modal');
    if (old) old.remove();
    var mask = document.createElement('div');
    mask.className = 'share-modal';
    mask.innerHTML =
      '<div class="share-box">' +
        '<img class="share-img" src="' + url + '" alt="战绩卡片"/>' +
        '<div class="share-tip">长按图片保存 · 或点下方按钮下载</div>' +
        '<div class="share-actions">' +
          '<a class="btn btn-primary share-dl" download="我的王朝战绩.png" href="' + url + '">⬇ 保存图片</a>' +
          '<button class="btn btn-secondary share-close">关闭</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    mask.querySelector('.share-close').onclick = function () { mask.remove(); };
    mask.onclick = function (e) { if (e.target === mask) mask.remove(); };
  }

  /* ============================================================
   * 排行榜（球迷成绩，本地存储 + 内置假数据）
   * ============================================================ */
  function saveToRank(r) {
    var list = loadRank();
    list.push({ name: '我（' + r.wins + '胜）', wins: r.wins, me: true, t: Date.now() });
    localStorage.setItem('tx8820_rank', JSON.stringify(list));
  }
  function loadRank() {
    try { return JSON.parse(localStorage.getItem('tx8820_rank') || '[]'); } catch (e) { return []; }
  }
  function renderRank() {
    root.innerHTML = '';
    var s = el('<div class="screen"></div>');
    s.appendChild(el('<div class="hero-title" style="font-size:24px;margin:10px 0 16px">球迷名人堂</div>'));

    var preset = [
      { name: '热血上海滩', wins: 79 }, { name: '科比的小迷弟', wins: 76 },
      { name: 'GOAT只有乔丹', wins: 73 }, { name: '约老师mvp', wins: 68 },
      { name: '勇蜜本蜜', wins: 64 }, { name: '湖人总冠军', wins: 61 },
      { name: '篮网摆烂办', wins: 33 },
    ];
    var mine = loadRank();
    var all = preset.concat(mine).sort(function (a, b) { return b.wins - a.wins; }).slice(0, 12);

    all.forEach(function (item, i) {
      var row = el('<div class="rank-item"></div>');
      row.innerHTML =
        '<span class="rank-no ' + (i < 3 ? 'top' : '') + '">' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)) + '</span>' +
        '<span class="rank-name" style="' + (item.me ? 'color:var(--tx-gold)' : '') + '">' + item.name + (item.me ? ' (我)' : '') + '</span>' +
        '<span class="rank-rec">' + item.wins + '-' + (82 - item.wins) + '</span>';
      s.appendChild(row);
    });

    var back = el('<button class="btn btn-primary" style="margin-top:10px">▶ 我也要挑战</button>');
    var home = el('<button class="btn btn-ghost">返回首页</button>');
    back.onclick = startGame;
    home.onclick = renderHome;
    s.appendChild(back); s.appendChild(home);
    root.appendChild(s);
  }

  /* ---------------- Debug：一键填完直接到结算页 ---------------- */
  // 在控制台执行 debugSkipToResult() 即可跳过所有选择流程
  window.debugSkipToResult = function () {
    // 重置状态（相当于重新开始一局）
    state = { round: 0, lineup: {}, currentDraw: null, coach: null, coachDraw: null, tactic: null, swapTeamUsed: false, swapDecadeUsed: false, coachSwapUsed: false, posFilter: 'all', locked: false };

    // 获取已选球员名列表，避免重复
    var takenNames = [];
    var isTaken = function (p) { return takenNames.indexOf(p.name) >= 0; };

    // 按位置逐一轮抽，每个位置独立抽取一支球队+年代，选一名能打该位置的球员
    POSITIONS.forEach(function (pos) {
      var picked = null;
      // 最多尝试 50 次，确保能找到不重复的球员
      for (var tries = 0; tries < 50 && !picked; tries++) {
        var combo = drawCombo();
        var eligible = combo.candidates.filter(function (p) {
          return p.pos.indexOf(pos) >= 0 && !isTaken(p);
        });
        if (eligible.length > 0) {
          picked = rand(eligible);
        }
      }
      // 最终兜底：不管重复也要选一个
      if (!picked) {
        var lastCombo = drawCombo();
        var anyEligible = lastCombo.candidates.filter(function (p) {
          return p.pos.indexOf(pos) >= 0;
        });
        picked = anyEligible.length > 0 ? rand(anyEligible) : lastCombo.candidates[0];
      }
      takenNames.push(picked.name);
      state.lineup[pos] = picked;
    });

    // 随机选主教练
    state.coach = rand(window.COACHES);

    // 随机选主打战术
    state.tactic = rand(TACTICS);

    // 直接跑模拟 → 渲染结算页
    runSimulation();

    // 尝试选中页面中的文本方便复制分享
    try {
      var urlInput = document.querySelector('.qr-url');
      if (urlInput) {
        var range = document.createRange();
        range.selectNodeContents(urlInput);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } catch (e) { /* ignore */ }

    console.log('✅ Debug: 已有' + Object.keys(state.lineup).length + '名球员、教练「' + state.coach.name + '」、战术「' + state.tactic.name + '」');
  };

  /* ---------------- 启动 ---------------- */
  renderHome();
})();
</script>
