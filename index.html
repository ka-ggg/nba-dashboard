<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA 2025-26 球员数据面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0c14;
  --bg-surface: #11141f;
  --bg-elevated: #181b2a;
  --bg-card: #1c1f30;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --text-primary: #e8ecf4;
  --text-secondary: #8b93a8;
  --text-muted: #5b6275;
  --nba-blue: #1d428a;
  --nba-blue-bright: #2b5cb8;
  --nba-red: #c8102e;
  --nba-red-bright: #e8354f;
  --nba-gold: #fdb927;
  --nba-gold-dim: #c8941e;
  --accent-win: #22c55e;
  --accent-loss: #ef4444;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
  --shadow-elevated: 0 4px 24px rgba(0,0,0,0.5);
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-spring: 350ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'Outfit', system-ui, -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

/* Background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(29,66,138,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 70%, rgba(200,16,46,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(253,185,39,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* Court line pattern */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: 0;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 70%);
}

.app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px 28px; }

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  margin-bottom: 24px;
  backdrop-filter: blur(12px);
  flex-wrap: wrap;
  gap: 16px;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-mark {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--nba-blue), var(--nba-red));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(29,66,138,0.3);
}

.logo-mark::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 22px;
  background: var(--nba-gold);
  border-radius: 2px 2px 0 0;
  bottom: 6px;
}

.logo-mark::before {
  content: '';
  position: absolute;
  width: 16px;
  height: 2px;
  background: var(--nba-gold);
  border-radius: 1px;
  top: 12px;
}

.header-title {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.header-title span { color: var(--nba-gold); }

.header-subtitle {
  font-size: 0.78rem;
  color: var(--text-secondary);
  font-weight: 400;
  letter-spacing: 0.02em;
}

.header-stats {
  display: flex;
  gap: 24px;
  align-items: center;
}

.stat-pill {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 16px;
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.stat-pill .stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--nba-gold);
}

.stat-pill .stat-label {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
}

/* Search bar */
.search-wrapper {
  position: relative;
  margin-bottom: 20px;
}

.search-input {
  width: 100%;
  padding: 14px 18px 14px 48px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-lg);
  color: var(--text-primary);
  font-family: 'Outfit', sans-serif;
  font-size: 0.95rem;
  transition: all var(--transition-smooth);
  outline: none;
}

.search-input::placeholder { color: var(--text-muted); }

.search-input:focus {
  border-color: var(--nba-blue-bright);
  box-shadow: 0 0 0 3px rgba(29,66,138,0.2), 0 0 20px rgba(29,66,138,0.1);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

/* Layout */
.main-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  align-items: start;
}

/* Team sidebar */
.team-sidebar {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 16px;
  position: sticky;
  top: 24px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-medium) transparent;
}

.team-sidebar::-webkit-scrollbar { width: 4px; }
.team-sidebar::-webkit-scrollbar-track { background: transparent; }
.team-sidebar::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

.sidebar-header {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 12px;
  padding: 0 8px;
  font-weight: 600;
}

.team-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.team-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 0.88rem;
  color: var(--text-secondary);
  border: 1px solid transparent;
  user-select: none;
}

.team-item:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border-color: var(--border-subtle);
}

.team-item.active {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border-color: var(--nba-blue);
  box-shadow: inset 0 0 0 1px rgba(29,66,138,0.3);
}

.team-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}

.team-name { font-weight: 500; }
.team-count {
  margin-left: auto;
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

.active .team-count { color: var(--nba-gold); }

/* Content area */
.content-area {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Team header card */
.team-header-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 28px 32px;
  display: flex;
  align-items: center;
  gap: 24px;
  position: relative;
  overflow: hidden;
}

.team-header-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.06;
  background: linear-gradient(135deg, var(--nba-blue) 0%, transparent 50%, var(--nba-red) 100%);
}

.team-logo-placeholder {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-md);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 1.2rem;
  color: white;
  position: relative;
  z-index: 1;
}

.team-info { position: relative; z-index: 1; }
.team-info h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
.team-info .conference {
  font-size: 0.78rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 4px;
}

.team-record {
  margin-left: auto;
  display: flex;
  gap: 16px;
  position: relative;
  z-index: 1;
}

.record-item {
  text-align: center;
}

.record-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2rem;
  font-weight: 800;
  line-height: 1;
}

.record-num.wins { color: var(--accent-win); }
.record-num.losses { color: var(--accent-loss); }

.record-label {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 4px;
}

/* Stats table */
.table-container {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  overflow: hidden;
}

.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
  gap: 12px;
}

.table-title {
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.table-count {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  margin-left: 8px;
}

.sort-buttons {
  display: flex;
  gap: 4px;
}

.sort-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.78rem;
  font-family: 'Outfit', sans-serif;
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.sort-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.sort-btn.active {
  background: var(--nba-blue);
  border-color: var(--nba-blue);
  color: white;
}

.table-wrapper {
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-medium) transparent;
}

.table-wrapper::-webkit-scrollbar { height: 4px; }
.table-wrapper::-webkit-scrollbar-track { background: transparent; }
.table-wrapper::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

thead th {
  padding: 12px 16px;
  text-align: left;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-elevated);
  cursor: pointer;
  user-select: none;
  transition: color var(--transition-fast);
  white-space: nowrap;
}

thead th:hover { color: var(--text-primary); }
thead th.sorted { color: var(--nba-gold); }

thead th .sort-arrow {
  display: inline-block;
  margin-left: 4px;
  font-size: 0.6rem;
  opacity: 0.4;
}

thead th.sorted .sort-arrow { opacity: 1; }

tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

tbody tr {
  transition: background var(--transition-fast);
}

tbody tr:hover {
  background: rgba(255,255,255,0.03);
}

.player-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.75rem;
  color: var(--nba-gold);
  border: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.player-name { font-weight: 600; }
.player-pos {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

.stat-highlight { color: var(--nba-gold); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

.empty-state {
  padding: 60px 24px;
  text-align: center;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
  opacity: 0.3;
}

.empty-state-text { font-size: 0.9rem; }

/* Footer */
.footer {
  margin-top: 32px;
  padding: 16px 0;
  text-align: center;
  font-size: 0.72rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border-subtle);
}

/* Responsive */
@media (max-width: 1024px) {
  .main-layout { grid-template-columns: 1fr; }
  .team-sidebar {
    position: static;
    max-height: none;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 12px;
  }
  .team-list { flex-direction: row; flex-wrap: wrap; }
  .team-item { font-size: 0.78rem; padding: 6px 10px; }
  .team-item .team-count { display: none; }
  .team-dot { width: 8px; height: 8px; }
  .sidebar-header { width: 100%; margin-bottom: 6px; }
  .header { padding: 16px 20px; }
  .header-stats { display: none; }
}

@media (max-width: 640px) {
  .app { padding: 12px; }
  .team-header-card { flex-direction: column; align-items: flex-start; padding: 20px; }
  .team-record { margin-left: 0; }
  .header { border-radius: var(--radius-lg); }
  .sort-btn { padding: 5px 10px; font-size: 0.7rem; }
  thead th, tbody td { padding: 8px 10px; font-size: 0.78rem; }
}

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.team-header-card { animation: fadeUp 0.4s ease-out; }
.table-container { animation: fadeUp 0.4s ease-out 0.05s both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>

<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="logo-mark"></div>
      <div>
        <div class="header-title">NBA <span>Stats</span> Hub</div>
        <div class="header-subtitle">2025-26 赛季球员数据面板</div>
      </div>
    </div>
    <div class="header-stats">

        <div class="stat-value" id="totalTeams">30</div>
        <div class="stat-label">球队</div>

      <div class="stat-pill">
        <div class="stat-value" id="totalPlayers">450+</div>
        <div class="stat-label">球员</div>
      </div>
      <div class="stat-pill">
        <div class="stat-value" id="season">25-26</div>
        <div class="stat-label">赛季</div>
      </div>
    </div>

  <!-- Search -->
  <div class="search-wrapper">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索球员姓名、位置或球队..." autocomplete="off">
  </div>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Team Sidebar -->
    <aside class="team-sidebar">
      <div class="sidebar-header">球队列表</div>
      <div class="team-list" id="teamList"></div>
    </aside>

    <!-- Content -->
    <main class="content-area">
      <!-- Team Header -->
      <div class="team-header-card" id="teamHeaderCard">

        <div class="team-info">
          <h2 id="teamName">全部球队</h2>
          <div class="conference" id="teamConference">NBA 2025-26 SEASON</div>
        </div>
        <div class="team-record" id="teamRecord"></div>
      </div>

      <!-- Table -->
      <div class="table-container">
        <div class="table-toolbar">
          <div>
            <span class="table-title">球员数据</span>
            <span class="table-count" id="resultCount">0 名球员</span>
          </div>
          <div class="sort-buttons" id="sortButtons">
            <button class="sort-btn active" data-sort="pts">得分</button>
            <button class="sort-btn" data-sort="reb">篮板</button>
            <button class="sort-btn" data-sort="ast">助攻</button>
            <button class="sort-btn" data-sort="stl">抢断</button>
            <button class="sort-btn" data-sort="blk">盖帽</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-col="name">球员</th>
                <th data-col="team">球队</th>
                <th data-col="pos">位置</th>
                <th data-col="gp">场次</th>
                <th data-col="pts" class="sorted">得分<span class="sort-arrow">▼</span></th>
                <th data-col="reb">篮板</th>
                <th data-col="ast">助攻</th>
                <th data-col="stl">抢断</th>
                <th data-col="blk">盖帽</th>
                <th data-col="fgpct">命中率</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-state-icon">&#9917;</div>
            <div class="empty-state-text">没有找到匹配的球员</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer">NBA Stats Hub &mdash; 数据面板 &middot; Designed with precision</footer>
</div>

// ── State ──
let activeTeam = null; // null = all teams
let activeSort = { col: 'pts', desc: true };
let searchQuery = '';

// ── DOM refs ──
const teamListEl = document.getElementById('teamList');
const teamLogoEl = document.getElementById('teamLogo');
const teamNameEl = document.getElementById('teamName');
const teamConferenceEl = document.getElementById('teamConference');
const teamRecordEl = document.getElementById('teamRecord');
const tableBody = document.getElementById('tableBody');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');
const sortButtons = document.getElementById('sortButtons');
const tableHeaders = document.querySelectorAll('thead th[data-col]');

// ── Render ──
function renderTeamList() {
  const allBtn = document.createElement('div');
  allBtn.className = 'team-item' + (activeTeam === null ? ' active' : '');
  allBtn.innerHTML = '<div class="team-dot" style="color:var(--nba-gold);background:var(--nba-gold);"></div><span class="team-name">全部球队</span><span class="team-count">ALL</span>';
  allBtn.addEventListener('click', () => selectTeam(null));
  teamListEl.innerHTML = '';
  teamListEl.appendChild(allBtn);

  teams.forEach(t => {
    const div = document.createElement('div');
    div.className = 'team-item' + (activeTeam === t.id ? ' active' : '');
    div.innerHTML = `<div class="team-dot" style="color:${t.color};background:${t.color};"></div><span class="team-name">${t.name}</span><span class="team-count">${t.players.length}</span>`;
    div.addEventListener('click', () => selectTeam(t.id));
    teamListEl.appendChild(div);
  });
}

function selectTeam(teamId) {
  activeTeam = teamId;
  renderTeamList();

  if (teamId === null) {
    teamLogoEl.style.background = 'linear-gradient(135deg, #1d428a, #c8102e)';
    teamLogoEl.textContent = 'ALL';
    teamNameEl.textContent = '全部球队';
    teamConferenceEl.textContent = 'NBA 2025-26 SEASON';
    const totalPlayers = teams.reduce((sum, t) => sum + t.players.length, 0);
    teamRecordEl.innerHTML = `<div class="record-item"><div class="record-num" style="color:var(--nba-gold);">${teams.length}</div><div class="record-label">球队</div></div><div class="record-item"><div class="record-num" style="color:var(--nba-gold);">${totalPlayers}</div><div class="record-label">球员</div></div>`;
  } else {
    const team = teams.find(t => t.id === teamId);
    teamLogoEl.style.background = team.color;
    teamLogoEl.textContent = team.id;
    teamNameEl.textContent = team.name;
    teamConferenceEl.textContent = team.conf;
    teamRecordEl.innerHTML = `<div class="record-item"><div class="record-num" style="color:var(--nba-gold);">${team.players.length}</div><div class="record-label">球员</div></div>`;
  }

  renderTable();
}

function getFilteredPlayers() {
  let players = [];
  if (activeTeam === null) {
    teams.forEach(t => t.players.forEach(p => players.push({ ...p, teamId: t.id, teamName: t.name })));
  } else {
    const team = teams.find(t => t.id === activeTeam);
    team.players.forEach(p => players.push({ ...p, teamId: team.id, teamName: team.name }));
  }

  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    players = players.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.teamName.toLowerCase().includes(q) ||
      p.pos.toLowerCase().includes(q)
    );
  }

  // Sort
  players.sort((a, b) => {
    let va = a[activeSort.col];
    let vb = b[activeSort.col];
    if (activeSort.col === 'fgpct') {
      return activeSort.desc ? vb - va : va - vb;
    }
    return activeSort.desc ? vb - va : va - vb;
  });

  return players;
}

function renderTable() {
  const players = getFilteredPlayers();
  resultCount.textContent = `${players.length} 名球员`;

  if (players.length === 0) {
    tableBody.innerHTML = '';
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    tableBody.innerHTML = players.map((p, i) => {
      const ptsClass = i === 0 && activeSort.col === 'pts' && activeSort.desc ? ' stat-highlight' : '';
      const rebClass = activeSort.col === 'reb' && i === 0 ? ' stat-highlight' : '';
      const astClass = activeSort.col === 'ast' && i === 0 ? ' stat-highlight' : '';
      const stlClass = activeSort.col === 'stl' && i === 0 ? ' stat-highlight' : '';
      const blkClass = activeSort.col === 'blk' && i === 0 ? ' stat-highlight' : '';
      return `
        <tr>
          <td>
            <div class="player-cell">
              <div class="player-avatar">${p.name.charAt(0)}</div>
              <div>
                <div class="player-name">${p.name}</div>
                <div class="player-pos">${p.pos}</div>
              </div>
            </div>
          </td>
          <td>${p.teamName}</td>
          <td><span class="player-pos">${p.pos}</span></td>
          <td>${p.gp}</td>
          <td class="${ptsClass}">${p.pts}</td>
          <td class="${rebClass}">${p.reb}</td>
          <td class="${astClass}">${p.ast}</td>
          <td class="${stlClass}">${p.stl}</td>
          <td class="${blkClass}">${p.blk}</td>
          <td>${(p.fgpct * 100).toFixed(1)}%</td>
        </tr>
      `;
    }).join('');
  }
}

// ── Event listeners ──
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  renderTable();
});

sortButtons.addEventListener('click', (e) => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;
  const col = btn.dataset.sort;
  if (activeSort.col === col) {
    activeSort.desc = !activeSort.desc;
  } else {
    activeSort.col = col;
    activeSort.desc = true;
  }
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateTableHeaders();
  renderTable();
});

function updateTableHeaders() {
  tableHeaders.forEach(th => {
    const col = th.dataset.col;
    th.classList.toggle('sorted', col === activeSort.col);
    const arrow = th.querySelector('.sort-arrow');
    if (col === activeSort.col) {
      if (!arrow) {
        const span = document.createElement('span');
        span.className = 'sort-arrow';
        th.appendChild(span);
      }
      th.querySelector('.sort-arrow').textContent = activeSort.desc ? '▼' : '▲';
    }
  });
}

tableHeaders.forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (!col) return;
    if (activeSort.col === col) {
      activeSort.desc = !activeSort.desc;
    } else {
      activeSort.col = col;
      activeSort.desc = true;
    }
    document.querySelectorAll('.sort-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.sort === activeSort.col);
    });
    updateTableHeaders();
    renderTable();
  });
});

// ── Init ──
renderTeamList();
renderTable();
updateTableHeaders();
</script>
