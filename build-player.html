<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BuildPlayer - 自建球员</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   BuildPlayer — Mobile-First Game Edition
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root {
  --bg: #faf5eb;--bg-card: #fffaf2;--bg-card-hover: #fff5e8;--bg-elevated: #fff0e0;
  --border: #f0e0cc;--border-light: #e8d5bc;--text: #2d1f0e;--text-dim: #8a7a66;
  --text-muted: #baa992;--orange: #ff6b35;--orange-light: #ff8a5c;
  --orange-dim: rgba(255,107,53,0.1);--orange-bg: rgba(255,107,53,0.06);
  --red: #e63946;--gold: #f7a600;--green: #2ec4b6;
  --shadow: 0 2px 12px rgba(45,31,14,0.08);--shadow-lg: 0 4px 24px rgba(45,31,14,0.12);
  --radius: 16px;--radius-sm: 10px;--radius-xs: 6px;
  --font-display: 'Fredoka','Noto Sans SC',sans-serif;--font-body: 'Nunito','Noto Sans SC',sans-serif;
  --safe-t: env(safe-area-inset-top,0px);--safe-b: env(safe-area-inset-bottom,0px);
  --safe-l: env(safe-area-inset-left,0px);--safe-r: env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding:var(--safe-t) var(--safe-r) calc(32px+var(--safe-b)) var(--safe-l)}
.hl{color:var(--orange)}.gold{color:var(--gold)}.text-dim{color:var(--text-dim)}
.navbar{display:flex;align-items:center;justify-content:center;padding:14px 20px 10px;position:sticky;top:0;z-index:50;background:rgba(250,245,235,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav-logo{font-family:var(--font-display);font-size:clamp(17px,4.5vw,22px);font-weight:700;color:var(--text);letter-spacing:1px}
.nav-logo .hl{color:var(--orange);font-size:1.1em}.nav-pos-toggle,.nav-pos-btn{display:none}
.hero{text-align:center;padding:min(5vh,40px)20px 20px;position:relative}
.hero::after{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle,rgba(255,107,53,0.06)0%,transparent 70%);pointer-events:none}
.hero-title{font-family:var(--font-display);font-size:clamp(11px,3vw,14px);color:var(--orange);font-weight:700;letter-spacing:3px;margin-bottom:6px;text-transform:uppercase}
.hero-headline{font-size:clamp(32px,8vw,48px);font-weight:700;line-height:1.1;font-family:var(--font-display);color:var(--text)}
.hero-headline .hl{color:var(--orange)}
.hero-desc{font-size:clamp(13px,3.5vw,16px);color:var(--text-dim);margin-top:10px;line-height:1.5;max-width:320px;margin-left:auto;margin-right:auto}
.feature-grid{display:flex;flex-direction:column;gap:12px;padding:8px 16px 20px}
.feature-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:24px 20px 20px;cursor:pointer;transition:all .15s;position:relative}
.feature-card:active{transform:scale(0.97)}.feature-card.selected{border-color:var(--orange);background:var(--orange-bg)}
.feature-card.disabled-card{opacity:.7;filter:grayscale(.3);cursor:default;pointer-events:none;border-style:dashed!important}
.feature-card .fc-tag{display:inline-block;font-family:var(--font-display);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.feature-card .fc-tag.gold{background:var(--orange-dim);color:var(--orange)}.feature-card .fc-tag.new{background:rgba(46,196,182,0.12);color:var(--green)}
.feature-card .fc-title{font-family:var(--font-display);font-size:26px;font-weight:700;margin-bottom:4px}
.feature-card .fc-sub{font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.5}
.feature-card .fc-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;transition:all .1s;width:100%;box-shadow:0 4px 0 #c94d1e,0 6px 12px rgba(255,107,53,0.25)}
.feature-card .fc-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c94d1e,0 3px 8px rgba(255,107,53,0.2)}
.feature-card .fc-btn:disabled{opacity:.4;box-shadow:none;transform:none}
.fc-footer{margin-top:10px;font-size:12px;color:var(--text-muted);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 24px;border:none;border-radius:12px;font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;transition:all .1s;min-height:48px;width:100%}
.btn:active{transform:scale(0.96)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 #c94d1e,0 6px 12px rgba(255,107,53,0.2)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #c94d1e,0 3px 8px rgba(255,107,53,0.15)}
.btn-secondary{background:var(--bg-card);color:var(--text);border:2px solid var(--border);box-shadow:0 3px 0 var(--border)}
.btn-secondary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.btn-sm{padding:10px 16px;font-size:13px;width:auto;min-height:40px;border-radius:10px}
.btn-xs{padding:5px 12px;font-size:11px;width:auto;min-height:32px;border-radius:8px;font-family:var(--font-display);letter-spacing:.5px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;transition:all .1s}
.btn-xs:active{transform:scale(0.95)}.btn-gold{background:var(--gold);color:#000;box-shadow:0 3px 0 #c48a00,0 4px 10px rgba(247,166,0,0.2)}
.btn-gold:active{transform:translateY(2px);box-shadow:0 1px 0 #c48a00,0 2px 6px rgba(247,166,0,0.15)}
.screen{display:none}.screen.active{display:block;animation:popIn .3s ease}
#screen-build.screen.active{display:flex!important;flex-direction:column;height:calc(100dvh - 32px - var(--safe-t) - var(--safe-b));overflow:hidden;position:relative}
#screen-career.screen.active{display:flex!important;flex-direction:column;min-height:calc(100dvh - 32px - var(--safe-t) - var(--safe-b))}
#screen-career.screen.active #career-area{flex:1;display:flex;flex-direction:column}
#screen-career.screen.active #career-area>div{flex:1;display:flex;flex-direction:column}
#screen-career.screen.active #career-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
@keyframes popIn{from{opacity:0;transform:scale(0.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0.3)}50%{box-shadow:0 0 0 6px rgba(255,107,53,0)}}
.section-title{text-align:center;padding:12px 16px 8px}
.section-title h1{font-family:var(--font-display);font-size:clamp(18px,5vw,24px);font-weight:700;color:var(--text);display:inline-block;padding-bottom:8px;border-bottom:3px solid var(--orange)}
.section-title .sub{font-size:clamp(12px,3vw,14px);color:var(--text-dim);margin-top:4px}
#screen-position{text-align:center;padding:0 12px 20px}
.pos-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:8px 16px 16px;max-width:360px;margin:0 auto}
.pos-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:18px 12px;text-align:center;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pos-card:active{transform:scale(0.95)}
.pos-card.selected{border-color:var(--orange);background:var(--orange-bg);box-shadow:0 0 0 1px var(--orange),var(--shadow)}
.pos-card .pos-label{font-family:var(--font-display);font-size:clamp(14px,3.5vw,18px);font-weight:700;display:block;margin-bottom:2px}
.pos-card .pos-en{font-family:var(--font-display);font-size:clamp(20px,5vw,28px);color:var(--orange);font-weight:700;display:block;letter-spacing:2px}
#screen-position .btn{max-width:280px;margin:8px auto 0}
#build-progress-area{flex-shrink:0}
.build-progress{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg-card);border:2px solid var(--border);border-radius:12px;margin:0 10px 6px}
.progress-bar{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-light));border-radius:5px;transition:width .4s ease}
.progress-text{font-family:var(--font-display);font-size:18px;color:var(--orange);min-width:36px;text-align:right}
.build-split{display:flex;flex-direction:row;gap:8px;padding:0 8px;flex:1;min-height:0;align-items:stretch}
.build-left{width:130px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;min-height:0}
.bl-header{text-align:center;padding:8px 4px 6px;background:var(--bg-card);border:2px solid var(--border);border-radius:10px}
.bl-ovr{display:block;font-family:var(--font-display);font-size:clamp(28px,7vw,36px);font-weight:700;color:var(--orange);line-height:1}
.bl-label{font-family:var(--font-display);font-size:10px;color:var(--text-dim);letter-spacing:2px}
.bl-attrs{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ba-slot{display:flex;align-items:center;gap:3px;padding:6px 6px;background:var(--bg-card);border:2px solid var(--border);border-radius:8px;transition:all .15s;cursor:default;min-height:36px}
.ba-slot.locked{border-color:var(--gold);background:linear-gradient(135deg,rgba(247,166,0,0.06),rgba(247,166,0,0.02))}
.ba-slot.clickable{cursor:pointer}.ba-slot.clickable:hover{border-color:var(--orange);background:var(--orange-bg)}
.ba-slot.clickable:active{transform:scale(0.96)}
.ba-slot .ba-label{font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--text-dim);min-width:20px}
.ba-slot .ba-grade{font-size:13px;font-weight:700;min-width:18px;text-align:center;font-family:var(--font-display)}
.ba-slot .ba-owner{font-size:8px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right;padding-left:2px}
.ba-slot.locked .ba-owner{color:var(--gold);font-weight:700}.ba-slot .ba-empty{font-size:14px;color:var(--border);margin-left:auto}
.bl-footer{display:none}.team-logo{width:18px;height:18px;border-radius:4px;vertical-align:middle;object-fit:contain;flex-shrink:0}
.build-right{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
#br-slot-area{flex-shrink:0}#br-roster-area{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.br-slot-area{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px 10px;text-align:center}
.br-slot-label{font-family:var(--font-display);font-size:12px;color:var(--orange);font-weight:700;letter-spacing:1px;margin-bottom:8px}
.br-slot-wrapper{display:flex;justify-content:center}
.br-slot-machine{position:relative;width:100%;max-width:160px;background:#fff;border:3px solid var(--border);border-radius:12px;overflow:hidden;height:114px;box-shadow:inset 0 2px 12px rgba(0,0,0,0.04)}
.br-slot-machine::before{content:'';position:absolute;left:0;right:0;top:38px;height:38px;background:rgba(255,107,53,0.05);border-top:2px dashed var(--orange-dim);border-bottom:2px dashed var(--orange-dim);z-index:2;pointer-events:none}
.br-slot-reel{transition:transform 2.8s cubic-bezier(0.15,0.85,0.25,1);will-change:transform}
.br-slot-reel.spinning{transition:transform 2.8s cubic-bezier(0.1,0.7,0.1,1)}
.br-slot-item{height:38px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text-dim);padding:0 10px;z-index:1}
.br-slot-item.highlight{color:var(--text);font-size:16px;font-weight:700}
/* 生涯球队老虎机 — 5项可见 */
.br-slot-machine.career-slot{height:190px}
.br-slot-machine.career-slot::before{top:76px}
.br-slot-machine.career-slot .br-slot-item.highlight{color:var(--text);font-size:16px;font-weight:700}
/* 自选球队弹窗 */
.team-picker-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:12px;animation:fadeIn .2s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.team-picker-modal{background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);width:100%;max-width:400px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 48px rgba(0,0,0,0.25);animation:slideUp .25s ease}
.team-picker-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.team-picker-header span{font-family:var(--font-display);font-size:16px;font-weight:700}
.team-picker-close{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:all .1s}
.team-picker-close:active{border-color:var(--orange);color:var(--orange)}
.team-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.team-pick-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:74px;justify-content:center}
.team-pick-card:active{transform:scale(0.95);border-color:var(--orange);background:var(--orange-bg)}
.team-pick-card img{display:block;width:32px;height:32px;object-fit:contain;border-radius:4px;margin-bottom:2px}
.team-pick-card .tpc-abbr{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text);letter-spacing:1px}
.team-pick-card .tpc-name{font-family:var(--font-body);font-size:8px;color:var(--text-dim);line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.br-slot-actions{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.br-slot-actions .slot-btn{font-family:var(--font-display);font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;transition:all .12s;min-height:36px;box-shadow:0 3px 0 var(--border)}
.br-slot-actions .slot-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.br-slot-actions .slot-btn:disabled{opacity:.3;cursor:default;box-shadow:none}
#br-roster-area .br-roster-list{display:flex;flex-direction:column;gap:5px}
.br-player{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg-card);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .12s;min-height:48px}
.br-player:active{transform:scale(0.97)}.br-player.selected{border-color:var(--orange);background:var(--orange-bg)}
.br-player .bp-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.br-player .bp-headshot{width:30px;height:30px;border-radius:50%;flex-shrink:0;border:2px solid var(--border)}
.br-player .bp-name{font-family:var(--font-display);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-player .bp-detail{font-family:var(--font-body);font-size:10px;color:var(--text-dim);font-weight:600}
.br-player .bp-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.br-player .bp-ovr{font-family:var(--font-display);font-size:18px;color:var(--text);line-height:1}
#build-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.build-toast-msg{background:var(--bg-card);border:2px solid var(--orange);border-radius:14px;padding:10px 20px;font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text);animation:slideUp .25s ease,fadeOut .3s ease 1.2s forwards;box-shadow:var(--shadow-lg)}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
/* ── 揭幕逐项动效 ── */
@keyframes revealContent{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 20px rgba(255,107,53,0.3),0 0 40px rgba(255,107,53,0.1)}50%{text-shadow:0 0 30px rgba(255,107,53,0.6),0 0 60px rgba(255,107,53,0.2)}}
@keyframes cardUnfold{0%{max-height:0;opacity:0;transform:translateY(20px) scaleY(0.95)}100%{max-height:600px;opacity:1;transform:translateY(0) scaleY(1)}}
.rv-item{opacity:0;animation:revealContent 0.55s ease forwards}
.rv-ovr{animation:revealContent 0.55s ease forwards,glowPulse 3s ease-in-out infinite}
.rv-card-wrap{animation:cardUnfold 0.6s ease forwards;overflow:hidden}
#screen-reveal{padding:0 10px 20px;text-align:center}
.reveal-card{text-align:center;background:var(--bg-card);border:3px solid var(--border);border-radius:var(--radius);padding:24px 16px;margin:0 0 12px}
.reveal-card .reveal-label{font-family:var(--font-display);font-size:13px;color:var(--text-dim);margin-bottom:4px;letter-spacing:2px}
.reveal-card .big-cname{font-family:var(--font-display);font-size:clamp(28px,7vw,38px);font-weight:700;color:var(--text)}
.reveal-card .big-ovr{font-family:var(--font-display);font-size:clamp(60px,16vw,80px);font-weight:700;color:var(--orange);line-height:0.85;margin:6px 0}
.reveal-card .big-grade{display:none}
.reveal-card .big-pos{font-family:var(--font-display);font-size:clamp(14px,3.5vw,18px);color:var(--text-dim);margin-top:6px;letter-spacing:2px}
.reveal-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding:0 0 12px}
.reveal-stat{background:var(--bg-card);border:2px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;opacity:0;animation:revealContent 0.45s ease forwards}
.reveal-stat .label{font-family:var(--font-display);font-size:9px;color:var(--text-dim);letter-spacing:.5px}
.reveal-stat .value{font-family:var(--font-display);font-size:20px;line-height:1;margin:2px 0}
.reveal-stat .num{font-size:10px;color:var(--text-dim);font-weight:600}
#screen-reveal .btn{max-width:280px;margin:12px auto 0}
.debug-btn{text-align:center;margin-top:16px}
.debug-btn button{background:var(--bg-card);border:none;color:var(--text-dim);padding:10px 18px;border-radius:12px;font-family:var(--font-display);font-size:12px;cursor:pointer}
.btn-conquest{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#d4af37;color:#1a1a2e;border:none;padding:12px 20px;border-radius:12px;font-family:var(--font-display);font-size:13px;cursor:pointer;font-weight:700;letter-spacing:1px;box-shadow:0 4px 0 #b8962e,0 6px 12px rgba(212,175,55,0.25);transition:all .1s ease;position:relative;top:0;min-height:44px}
.btn-conquest:active{transform:translateY(3px);box-shadow:0 1px 0 #b8962e,0 3px 8px rgba(212,175,55,0.15)}
.btn-help{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg-card);color:var(--text);border:2px solid var(--border);padding:12px 16px;border-radius:12px;font-family:var(--font-display);font-size:13px;cursor:pointer;font-weight:600;box-shadow:0 3px 0 var(--border);transition:all .1s ease;position:relative;top:0;min-height:44px}
.btn-help:hover{border-color:var(--orange);color:var(--orange)}
.btn-help:active{transform:translateY(2px);box-shadow:0 1px 0 var(--border)}
.br-player .bp-headshot:empty,.bl-headshot:empty{background:var(--border)}
.bp-headshot{border-radius:50%;border:2px solid var(--border)}

/** 获取球员头像样式（仅 NBA CDN） */
function getPlayerHeadshotStyle(playerName, displaySize) {
  if (!playerName) return '';
  displaySize = displaySize || 30;
  if (typeof NBA_PLAYER_IMAGES !== 'undefined') {
    var fixedName = (typeof HEADSHOT_NAME_FIX !== 'undefined' && HEADSHOT_NAME_FIX[playerName]) || playerName;
    var pid = NBA_PLAYER_IMAGES[fixedName];
    if (!pid) {
      for (var key in NBA_PLAYER_IMAGES) {
        if (key.indexOf(playerName) >= 0 || playerName.indexOf(key) >= 0 ||
            (fixedName !== playerName && (key.indexOf(fixedName) >= 0 || fixedName.indexOf(key) >= 0))) {
          pid = NBA_PLAYER_IMAGES[key]; break;
        }
      }
    }
    if (pid) {
      var url = 'https://cdn.nba.com/headshots/nba/latest/260x190/' + pid + '.png';
      return 'background-image:url(' + url + ');background-size:cover;background-position:center;background-repeat:no-repeat;width:' + displaySize + 'px;height:' + displaySize + 'px;';
    }
  }
  return '';
}

<script>
// -- Storage (local localStorage) --
var Storage = {
  _ready: null,
  waitForReady: function(cb) {
    if (!Storage._ready) { Storage._ready = Promise.resolve(); }
    if (typeof cb === 'function') { Storage._ready.then(cb).catch(function(){}); }
    return Storage._ready;
  },
  _validateKey: function(key) {
    if (typeof key !== 'string') return false;
    var k = key.trim();
    return k.length > 0 && /^[a-zA-Z0-9_-]+$/.test(k);
  },
  setValue: function(data) {
    try {
      for (var key in data) {
        if (!data.hasOwnProperty(key)) continue;
        if (!Storage._validateKey(key)) { return Promise.resolve(); }
      }
      var serialized = JSON.stringify(data);
      if (serialized.length > 200 * 1024) { return Promise.resolve(); }
      for (var k in data) {
        if (!data.hasOwnProperty(k)) continue;
        try { localStorage.setItem('bp:' + k, JSON.stringify(data[k])); } catch(e) {}
      }
      return Promise.resolve();
    } catch(e) {}
    return Promise.resolve();
  },
  getValue: function(key) {
    try {
      if (key !== undefined && !Storage._validateKey(key)) return Promise.resolve(null);
      if (key === undefined) {
        var all = {};
        for (var i = 0; i < localStorage.length; i++) {
          var sk = localStorage.key(i);
          if (sk && sk.indexOf('bp:') === 0) {
            var kName = sk.slice(3);
            try { all[kName] = JSON.parse(localStorage.getItem(sk)); } catch(e) { all[kName] = localStorage.getItem(sk); }
          }
        }
        return Promise.resolve(all);
      }
      var raw = localStorage.getItem('bp:' + key);
      if (raw == null) return Promise.resolve(null);
      try { return Promise.resolve(JSON.parse(raw)); } catch(e) { return Promise.resolve(raw); }
    } catch(e) { return Promise.resolve(null); }
  },
  savePlayer: function(playerData) {
    Storage.getValue('players').then(function(raw) {
      var arr = [];
      if (raw != null) {
        if (Array.isArray(raw)) { arr = raw; }
        else if (typeof raw === 'string') { try { arr = JSON.parse(raw); } catch(e) { arr = []; } }
        if (!Array.isArray(arr)) arr = [];
      }
      arr.push(playerData);
      Storage.setValue({ players: arr });
    }).catch(function() {
      Storage.setValue({ players: [playerData] });
    });
  }
};
</script>

// ==================== 跨位置衰减 ====================
/** 计算跨位置衰减系数：你建的位置 vs 来源球员位置 */
function getPosPenalty(userPos, srcPos, attrKey) {
  const srcAvg = SIM_CONFIG.POS_AVG[srcPos] && SIM_CONFIG.POS_AVG[srcPos][attrKey];
  const userAvg = SIM_CONFIG.POS_AVG[userPos] && SIM_CONFIG.POS_AVG[userPos][attrKey];
  if (!srcAvg || srcAvg <= 0) return 1.0;
  return Math.min(1.0, userAvg / srcAvg);
}

/** Render left attribute sidebar */
function renderLeftAttrs() {
  // OVR
  const ovrEl = document.getElementById('bl-ovr');
  if (ovrEl) {
    let ovr = STATE.finalOVR || 0;
    if (!ovr && STATE.position) {
      const w = SIM_CONFIG.OVR_WEIGHTS[STATE.position];
      if (w) {
        // 先算已锁定属性的加权平均值
        let lockedSum = 0, lockedWeight = 0;
        ATTR_KEYS.forEach(k => {
          const val = STATE.attrs[k];
          const weight = w[k] || 0.07;
          if (val !== null) { lockedSum += val * weight; lockedWeight += weight; }
        });
        // 未锁定任何属性时显示 --
        if (lockedWeight === 0) { ovr = 0; }
        else {
          const fillAvg = lockedSum / lockedWeight;
          // 用填充值计算完整OVR
          let c = 0;
          ATTR_KEYS.forEach(k => {
            const val = STATE.attrs[k] !== null ? STATE.attrs[k] : Math.round(fillAvg);
            c += val * (w[k] || 0.07);
          });
          ovr = Math.round(c);
        }
      }
    }
    ovrEl.textContent = ovr > 0 ? ovr : '--';
  }

  // Attributes
  const container = document.getElementById('bl-attrs');
  if (!container) return;
  container.innerHTML = '';
  
  ATTR_KEYS.forEach(key => {
    const val = STATE.attrs[key];
    const isLocked = val !== null;
    const div = document.createElement('div');
    
    let cls = 'ba-slot';
    if (isLocked) cls += ' locked';
    else if (STATE.selectedPlayer) {
      cls += ' clickable';
      div.onclick = () => lockAttr(key);
    }
    div.className = cls;
    
    if (isLocked) {
      const g = getGrade(val);
      const slot = STATE.attrSlots[key];
      const hadPenalty = slot && slot.penalty < 1.0;
      div.innerHTML = `
        <span class="ba-label">${attrCN(key)}</span>
        <span class="ba-grade" style="color:${g.color}">${g.letter}</span>
        <span class="ba-owner" title="${hadPenalty ? `原始${slot.raw} × ${slot.penalty.toFixed(2)}` : ''}" 
             style="${hadPenalty ? 'color:var(--accent);' : ''}">${slot?.player ? getPlayerDisplayName(slot.player) : ''}</span>
      `;
    } else if (STATE.selectedPlayer) {
      const pv = parseInt(STATE.selectedPlayer[key]) || 50;
      // 计算跨位置衰减后的值
      const playerPos = getPlayerMainPos(STATE.selectedPlayer);
      const penalty = getPosPenalty(STATE.position, playerPos, key);
      const adjustedVal = Math.round(pv * penalty);
      const hasPenalty = penalty < 1.0;
      const pg = getGrade(adjustedVal);
      div.innerHTML = `
        <span class="ba-label">${attrCN(key)}</span>
        <span class="ba-grade" style="color:${pg.color}">${pg.letter}</span>
        <span class="ba-owner"${hasPenalty ? ` style="color:var(--accent);font-size:9px;"` : ''}>${hasPenalty ? `${adjustedVal}▼` : adjustedVal}</span>
      `;
    } else {
      div.innerHTML = `
        <span class="ba-label">${attrCN(key)}</span>
        <span class="ba-empty">+</span>
      `;
    }
    container.appendChild(div);
  });

  // Footer — 已隐藏
  const footer = document.getElementById('bl-footer');
  if (footer) footer.innerHTML = '';
}

  const slotArea = document.getElementById('br-slot-area');
  if (!slotArea) return;
  
  const sorted = [...NBA2K_TEAMS].sort();
  const copies = 5;
  const allItems = [];
  for (let c = 0; c < copies; c++) {
    sorted.forEach(t => allItems.push(t));

  let itemsHtml = '';

    reel.style.transition = '';
  }
  
  const rosterArea = document.getElementById('br-roster-area');
  if (rosterArea) rosterArea.innerHTML = '';
}

  const slotArea = document.getElementById('br-slot-area');

function pullHandle() {
  
  if (_slotSpinning || STATE._mustLockAfterSpin) return;

  if (reel) reel.classList.add('spinning');
  
  setTimeout(spinSlotMachine, 200);

function spinSlotMachine() {
  if (_slotSpinning) return;
  _slotSpinning = true;
  
  const reel = document.getElementById('slot-reel');
  if (!reel) { _slotSpinning = false; return; }
  
  const sorted = [...NBA2K_TEAMS].sort();
  const teamCount = sorted.length;
  const itemH = 38;
  const copyLen = teamCount * itemH; // 一个完整复制的高度
  
  // 随机目标球队
  const targetIdx = Math.floor(Math.random() * teamCount);
  const targetTeam = sorted[targetIdx];
  
  // 目标位置：让 target 出现在窗口中间（第2个可见位）
  // 窗口显示3项，中间项索引=1，所以偏移到 targetIdx-1
  const snapIdx = (targetIdx - 1 + teamCount) % teamCount;
  
  // 落到第3个复制块（索引2），留出上下缓冲
  const targetY = copyLen * 2 + snapIdx * itemH;
  
  // 获取当前位置
  const curMatch = reel.style.transform.match(/([\d.]+)/);
  const curY = curMatch ? parseFloat(curMatch[0]) : copyLen;
  
  // 保证至少转半圈
  let finalY = targetY;
  const minSpin = copyLen * 0.5;
  while (finalY <= curY + minSpin) finalY += copyLen;
  
  // 防止超出边界（5个复制块上限）
  const maxY = copyLen * 4 - itemH * 2;
  if (finalY > maxY) {
    reel.style.transition = 'none';
    reel.style.transform = `translateY(-${copyLen}px)`;
    void reel.offsetHeight;
    reel.style.transition = '';
    finalY = targetY + copyLen;
  }
  
  // 执行旋转动画
  reel.classList.add('spinning');
  reel.style.transform = `translateY(-${finalY}px)`;
  
  // 动画结束后，精确回正到目标位置（去掉过渡，直接对齐）
  setTimeout(() => {
    reel.classList.remove('spinning');
    
    // ★ 关键修复：无过渡跳转到精确位置，确保显示正确
    const exactY = copyLen * 3 + snapIdx * itemH; // 落到第4复制块中间区
    reel.style.transition = 'none';
    reel.style.transform = `translateY(-${exactY}px)`;
    void reel.offsetHeight;
    reel.style.transition = '';
    
    // ★ 高亮中间项（窗口3项，snapIdx为顶部，中间=snapIdx+1）
    var middleIdx = teamCount * 3 + snapIdx + 1;
    highlightSlotItem('slot-reel', middleIdx);
    
    // 同步状态
    STATE.currentTeam = targetTeam;
    if (STATE._teamsVisited.indexOf(targetTeam) === -1) {
      STATE._teamsVisited.push(targetTeam);
      console.log('[Build] 已访问球队:', STATE._teamsVisited.join(', '));
    }
    STATE.selectedPlayer = null;
    STATE._shownThisTeam = [];
    STATE._mustLockAfterSpin = true;
    _slotSpinning = false;
    
    renderLeftAttrs();
    updateSlotButtons();
    showTeamRoster(targetTeam);
  }, 2800);
}

// ==================== 4. 相似球员匹配 ====================
function findSimilarPlayers(attrs, pos, topN = 3) {
  const posAvg = SIM_CONFIG.POS_AVG[pos];
  if (!posAvg) return [];
  
  // 用户属性相对位置平均值的偏差向量
  const userVec = ATTR_KEYS.map(k => (attrs[k] || 50) - (posAvg[k] || 50));
  const userNorm = Math.sqrt(userVec.reduce((s, v) => s + v * v, 1));
  
  // 遍历所有 NBA 球员
  const scores = [];
  NBA2K_TEAMS.forEach(team => {
    (NBA2K_DATA[team] || []).forEach(player => {
      // 该球员属性相对同一位置平均值的偏差向量
      const hisVec = ATTR_KEYS.map(k => (parseInt(player[k]) || 50) - (posAvg[k] || 50));
      const hisNorm = Math.sqrt(hisVec.reduce((s, v) => s + v * v, 1));
      
      // 点积
      let dot = 0;
      for (let i = 0; i < ATTR_KEYS.length; i++) {
        dot += userVec[i] * hisVec[i];
      }
      
      // 余弦相似度（偏差向量）
      const similarity = Math.round((dot / (userNorm * hisNorm)) * 100);
      scores.push({ player, team, similarity });
    });
  });
  
  // 按相似度降序排列，取 Top N
  scores.sort((a, b) => b.similarity - a.similarity);
  return scores.slice(0, topN);
}

/**
 * 按 OVR 分三档（85-100、75-85、<75），每档取最相似球员
 */
function findTieredPlayers(attrs, pos) {
  const posAvg = SIM_CONFIG.POS_AVG[pos];
  if (!posAvg) return [];
  
  // 同位置组过滤：只匹配相同或相近位置的球员
  const POS_GROUP = {
    'PG': ['PG', 'SG'],
    'SG': ['SG', 'PG', 'SF'],
    'SF': ['SF', 'SG', 'PF'],
    'PF': ['PF', 'SF', 'C'],
    'C':  ['C', 'PF'],
  };
  const allowedPositions = POS_GROUP[pos] || ['PG', 'SG', 'SF', 'PF', 'C'];
  
  const userVec = ATTR_KEYS.map(k => (attrs[k] || 50) - (posAvg[k] || 50));
  const userNorm = Math.sqrt(userVec.reduce((s, v) => s + v * v, 1));
  
  const tiers = [
    { min: 85, max: 100, label: '精英', result: null, bestSim: -1 },
    { min: 75, max: 85, label: '主力', result: null, bestSim: -1 },
    { min: 0,  max: 75, label: '轮换', result: null, bestSim: -1 },
  ];
  
  NBA2K_TEAMS.forEach(team => {
    (NBA2K_DATA[team] || []).forEach(player => {
      const playerMainPos = getPlayerMainPos(player);
      if (!allowedPositions.includes(playerMainPos)) return;
      
      const ovr = parseInt(player.ovr) || 0;
      const tier = tiers.find(t => ovr >= t.min && ovr < t.max);
      if (!tier) return;
      
      const hisVec = ATTR_KEYS.map(k => (parseInt(player[k]) || 50) - (posAvg[k] || 50));
      const hisNorm = Math.sqrt(hisVec.reduce((s, v) => s + v * v, 1));
      let dot = 0;
      for (let i = 0; i < ATTR_KEYS.length; i++) {
        dot += userVec[i] * hisVec[i];
      }
      const similarity = Math.round((dot / (userNorm * hisNorm)) * 100);
      
      if (similarity > tier.bestSim) {
        tier.bestSim = similarity;
        tier.result = { player, team, similarity, ovr };
      }
    });
  });
  
  return tiers.map(t => t.result).filter(Boolean);
}

// ==================== 4.5 Archetype 推导匹配 ====================
/** 同类位置分组：匹配时只找同组球员 */
const POS_GROUP = {
  'PG': ['PG', 'SG'],
  'SG': ['SG', 'PG', 'SF'],
  'SF': ['SF', 'SG', 'PF'],
  'PF': ['PF', 'SF', 'C'],
  'C':  ['C', 'PF'],
};

/**
 * 按位置筛选 → 余弦匹配最相似球员 → 输出其 archetype
 */
function matchPlayerArchetype(attrs, topN = 3) {
  const ATTRS = ['threePT', 'MID', 'FIN', 'DNK', 'HAN', 'PAS', 'PDEF', 'IDEF', 'BLK', 'REB', 'ATH', 'STR', 'CLU'];
  const userPos = STATE.position || 'SF';
  const allowedPositions = POS_GROUP[userPos] || ['PG', 'SG', 'SF', 'PF', 'C'];
  
  // 用户属性向量
  const userVec = ATTRS.map(k => attrs[k] || 50);
  const userNorm = Math.sqrt(userVec.reduce((s, v) => s + v * v, 1));
  
  // 遍历所有 NBA 球员，只算同位置组的余弦相似度
  const playerScores = [];
  NBA2K_TEAMS.forEach(team => {
    (NBA2K_DATA[team] || []).forEach(player => {
      const playerMainPos = getPlayerMainPos(player);
      // 不在同位置组内 → 跳过
      if (!allowedPositions.includes(playerMainPos)) return;
      
      const playerVec = ATTRS.map(k => parseInt(player[k]) || 50);
      const playerNorm = Math.sqrt(playerVec.reduce((s, v) => s + v * v, 1));
      
      let dot = 0;
      for (let i = 0; i < ATTRS.length; i++) {
        dot += userVec[i] * playerVec[i];
      }
      
      const similarity = Math.round((dot / (userNorm * playerNorm)) * 1000) / 10;
      
      playerScores.push({
        similarity,
        player,
        team,
        archetype: player.type || 'Unknown',
        playerPos: playerMainPos,
      });
    });
  });
  
  // 按相似度降序，取 Top N
  playerScores.sort((a, b) => b.similarity - a.similarity);
  const topPlayers = playerScores.slice(0, topN);
  
  // 直接输出匹配球员的 archetype 信息
  return topPlayers.map(item => {
    const p = item.player;
    const meta = NBA2K_ARCHETYPES ? NBA2K_ARCHETYPES[item.archetype] : null;
    return {
      archetype: item.archetype,
      cn: meta?.cn || item.archetype,
      icon: meta?.icon || '⭐',
      category: meta?.category || 'all_around',
      similarity: item.similarity,
      avgOVR: meta?.avgOVR || 0,
      archCount: meta?.count || 0,
      player: p,
      playerName: p.cname || p.name,
      playerPos: item.playerPos,
      playerTeam: item.team,
      playerOVR: parseInt(p.ovr) || 0,
    };
  });
}

function pullCareerHandle() {

function spinCareerSlot() {
  const reel = document.getElementById('career-slot-reel');
  if (!reel) return;
  
  var pool = STATE._teamsVisited.length > 0 ? STATE._teamsVisited : [...NBA2K_TEAMS].sort();
  var sorted = pool.slice().sort();
  var teamCount = sorted.length;
  const itemH = 38;
  const copyLen = teamCount * itemH;
  
  const targetIdx = Math.floor(Math.random() * teamCount);
  const targetTeam = sorted[targetIdx];
  
  // 窗口显示5项，中间项索引=2，所以偏移到 targetIdx-2
  const snapIdx = (targetIdx - 2 + teamCount) % teamCount;
  const targetY = copyLen * 2 + snapIdx * itemH;
  
  const curMatch = reel.style.transform.match(/([\d.]+)/);
  const curY = curMatch ? parseFloat(curMatch[0]) : copyLen + 38;
  
  let finalY = targetY;
  while (finalY <= curY + copyLen * 0.5) {
    finalY += copyLen;
  }
  
  const maxY = copyLen * 4 - itemH * 4;
  if (finalY > maxY) {
    reel.style.transition = 'none';
    reel.style.transform = `translateY(-${copyLen}px)`;
    void reel.offsetHeight;
    reel.style.transition = '';
    finalY = targetY + copyLen;
  }
  
  reel.classList.add('spinning');
  reel.style.transform = `translateY(-${finalY}px)`;
  
  setTimeout(() => {
    reel.classList.remove('spinning');
    
    // ★ 精确回正
    const exactY = copyLen * 3 + snapIdx * itemH;
    reel.style.transition = 'none';
    reel.style.transform = `translateY(-${exactY}px)`;
    void reel.offsetHeight;
    reel.style.transition = '';
    
    // ★ 高亮中间项（窗口5项，snapIdx为顶部，中间=snapIdx+2）
    var middleIdx = teamCount * 3 + snapIdx + 2;
    highlightSlotItem('career-slot-reel', middleIdx);
    
    selectCareerTeam(targetTeam);
  }, 3300);
}

function selectCareerTeam(team) {
  STATE.careerTeam = team;
  const teamPlayers = NBA2K_DATA[team];
  const cnName = getTeamName(team);
  
  // 判断首发/替补：比较自己位置在球队的最高OVR
  var pos = STATE.position;
  var myOvr = STATE.finalOVR;
  var bestTeammateOvr = 0;
  if (teamPlayers) {
    teamPlayers.forEach(function(p) {
      var pPos = (p.pos || '').split('/')[0].trim();
      if (pPos === pos) {
        var ovr = parseInt(p.ovr) || 0;
        if (ovr > bestTeammateOvr) bestTeammateOvr = ovr;
      }
    });
  }
  var role = myOvr >= bestTeammateOvr ? '首发' : '替补';
  STATE.season.isUserStarter = (role === '首发');
  
  // 构建阵容
  var isLogin = isLoggedIn();
  var displayName = getDisplayName();
  var userPlayer = {
    name: displayName, cname: displayName,
    ovr: myOvr, pos: STATE.position, posCn: SIM_CONFIG.POSITIONS[pos],
    _isUser: true,
  };
  
  // 从队友中选各位置最佳首发
  var posOrder = ['PG', 'SG', 'SF', 'PF', 'C'];
  var starters = [], bench = [];
  var usedIndices = new Set();
  
  if (teamPlayers) {
    posOrder.forEach(function(p) {
      var best = -1, bestIdx = -1;
      teamPlayers.forEach(function(tp, ti) {
        if (usedIndices.has(ti)) return;
        var tpPos = (tp.pos || '').split('/')[0].trim();
        if (tpPos === p && (parseInt(tp.ovr) || 0) > best) {
          best = parseInt(tp.ovr) || 0;
          bestIdx = ti;
        }
      });
      if (bestIdx >= 0) {
        usedIndices.add(bestIdx);
        starters.push(teamPlayers[bestIdx]);
      }
    });
    // 剩余球员按OVR排序进替补
    teamPlayers.forEach(function(tp, ti) {
      if (!usedIndices.has(ti)) bench.push(tp);
    });
    bench.sort(function(a, b) { return (parseInt(b.ovr) || 0) - (parseInt(a.ovr) || 0); });
  }
  
  // 自建球员插入阵容（与 calcTeamLineup 逻辑一致）
  if (role === '首发') {
    // 替换同位置首发，被替换者进替补
    var replacedPlayer = null;
    for (var si = 0; si < starters.length; si++) {
      var sp2 = (starters[si].pos || '').split('/')[0].trim();
      if (sp2 === pos) {
        replacedPlayer = starters[si];
        starters[si] = userPlayer;
        break;
      }
    }
    if (replacedPlayer) {
      bench.unshift(replacedPlayer);
    }
  } else {
    // 用户替补，放在替补第一位
    bench.unshift(userPlayer);
  }
  
  // 自建球员头像
  var defaultAvatar = '';
  var avatarUrl = getAvatarUrl() || defaultAvatar;
  
  function renderRosterPlayer(p, isUser, idx) {
    var pOvr = parseInt(p.ovr) || 0;
    var pPos = p.posCn || p.pos || '—';
    var pName = p.cname || p.name;
    var imgHtml;
    if (isUser) {
      imgHtml = '<img class="bp-headshot" style="border-radius:50%;border:2px solid var(--border);width:28px;height:28px;object-fit:cover;" src="' + avatarUrl + '" onerror="this.onerror=null;this.src=\'' + defaultAvatar + '\'">';
    } else {
      var hs = getPlayerHeadshotStyle(p.name, 28);
      imgHtml = hs ? '<div class="bp-headshot" style="' + hs + ';border-radius:50%;border:2px solid var(--border);width:28px;height:28px;"></div>' : '<div style="width:28px;height:28px;border-radius:50%;background:var(--border);"></div>';
    }
    var starBadge = isUser ? '<span style="font-size:10px;margin-left:2px;">⭐</span>' : '';
    return '<div style="display:flex;align-items:center;gap:5px;padding:4px 6px;border-bottom:1px solid var(--border-light);font-size:12px;' + (isUser ? 'background:var(--orange-bg);border-radius:6px;margin:1px 0;border:1.5px solid var(--orange);' : '') + '">'
      + imgHtml
      + '<span style="width:40px;font-size:10px;color:var(--text-dim);">' + pPos + '</span>'
      + '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:' + (isUser ? '700' : '400') + ';color:' + (isUser ? 'var(--orange)' : 'var(--text)') + ';">' + pName + starBadge + '</span>'
      + '<span style="font-family:var(--font-display);font-weight:700;font-size:13px;color:' + (isUser ? 'var(--orange)' : 'var(--text)') + ';">' + pOvr + '</span>'
      + '</div>';
  }
  
  var rosterHtml = '<div style="font-family:var(--font-display);font-size:11px;color:var(--orange);padding:2px 4px 4px;letter-spacing:0.5px;">🏀 首发阵容</div>';
  starters.forEach(function(p) { rosterHtml += renderRosterPlayer(p, p._isUser); });
  rosterHtml += '<div style="font-family:var(--font-display);font-size:11px;color:var(--text-dim);padding:6px 4px 4px;letter-spacing:0.5px;border-top:1px solid var(--border);margin-top:2px;">🔄 替补阵容</div>';
  bench.forEach(function(p, i) { rosterHtml += renderRosterPlayer(p, p._isUser, i); });
  
  // ★ 保存本次建球员数据到 storage
  saveBuildPlayerData(team);

  html('career-area').innerHTML = `
    <div style="padding:0 12px;" id="career-scroll">
      <div class="reveal-card" style="position:relative;">
        <div style="position:absolute;top:8px;left:8px;">${getTeamLogo(team, 32)}</div>
        <div style="font-size:13px;color:var(--text-dim);">我的生涯球队</div>
        <div style="font-size:24px;font-weight:800;margin:6px 0;font-family:var(--font-display);letter-spacing:2px;">${cnName}</div>
        <div style="font-size:12px;color:var(--text-dim);">我担任的角色为${role}${SIM_CONFIG.POSITIONS[STATE.position]}</div>
        <div style="margin-top:12px;">
          <button class="btn btn-primary" onclick="startSeason()">🏀 开始赛季</button>
        </div>
      </div>
      <div style="margin-top:8px;background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 4px;">
        ${rosterHtml}
      </div>
    </div>
  `;
}

function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** 老虎机高亮中间可见项（替换静态 nth-child，随滚动位置正确对齐） */
function highlightSlotItem(reelId, middleIndex) {
  var reel = document.getElementById(reelId);
  if (!reel) return;
  reel.querySelectorAll('.br-slot-item.highlight').forEach(function(el) { el.classList.remove('highlight'); });
  var items = reel.querySelectorAll('.br-slot-item');
  if (items[middleIndex]) items[middleIndex].classList.add('highlight');

function getConference(team) {
  if (SIM_CONFIG.CONFERENCE.EAST.includes(team)) return 'EAST';
  if (SIM_CONFIG.CONFERENCE.WEST.includes(team)) return 'WEST';
  return 'EAST';
}

function getDivision(team) {
  for (const [div, teams] of Object.entries(SIM_CONFIG.DIVISIONS)) {
    if (teams.includes(team)) return div;
  }
  return null;
}

function getTeamName(team) { return SIM_CONFIG.TEAM_NAMES[team] || team; }

/** 查找球员所属球队缩写 */
function getPlayerTeam(player) {
  for (const team of NBA2K_TEAMS) {
    if (NBA2K_DATA[team] && NBA2K_DATA[team].includes(player)) return team;
  }
  return null;
}

/** 获取球员显示名：优先中文名（取-后部分），无中文名则取逗号后的名 */
function getPlayerDisplayName(playerName) {
  // 先找中文名
  for (const team of NBA2K_TEAMS) {
    const players = NBA2K_DATA[team];
    if (!players) continue;
    const p = players.find(p => p.name === playerName);
    if (p) {
      const cn = p.cname || '';
      const dashIdx = cn.indexOf('-');
      return dashIdx >= 0 ? cn.slice(dashIdx + 1) : (cn || playerName);
    }
  }
  // 无中文名 → 取逗号后（如 "Brunson, Jalen" → "Jalen"）
  const commaIdx = playerName.indexOf(', ');
  return commaIdx >= 0 ? playerName.slice(commaIdx + 2) : playerName;
}

/** 获取球队在联盟中的种子排名（1-15） */
function getConferenceSeed(team) {
  const conf = getConference(team);
  const teams = conf === 'EAST' ? SIM_CONFIG.CONFERENCE.EAST : SIM_CONFIG.CONFERENCE.WEST;
  const standings = STATE.season.standings;
  if (!standings) return 99;
  const sorted = teams
    .map(t => ({ team: t, ...standings[t] }))
    .sort((a, b) => {
      const apct = a.wins + a.losses > 0 ? a.wins / (a.wins + a.losses) : 0;
      const bpct = b.wins + b.losses > 0 ? b.wins / (b.wins + b.losses) : 0;
      return bpct - apct || b.wins - a.wins;
    });
  const idx = sorted.findIndex(s => s.team === team);
  return idx >= 0 ? idx + 1 : 99;
}

/** 获取同分区所有球队按种子排序的列表 */
function getConferenceSorted(conf) {
  const teams = conf === 'EAST' ? SIM_CONFIG.CONFERENCE.EAST : SIM_CONFIG.CONFERENCE.WEST;
  const standings = STATE.season.standings;
  if (!standings) return [];
  return teams
    .map(t => ({ team: t, wins: standings[t]?.wins || 0, losses: standings[t]?.losses || 0 }))
    .sort((a, b) => {
      const apct = a.wins + a.losses > 0 ? a.wins / (a.wins + a.losses) : 0;
      const bpct = b.wins + b.losses > 0 ? b.wins / (b.wins + b.losses) : 0;
      return bpct - apct || b.wins - a.wins;
    });
}

/** 从所有比赛结果重新统计 standings */
function reconcileStandings() {
  var st = STATE.season.standings;
  if (!st) return;
  // 重置
  for (var team in st) {
    if (st.hasOwnProperty(team)) { st[team].wins = 0; st[team].losses = 0; }
  }
  // 统计用户已模拟的比赛
  var allGames = STATE.season.games || [];
  for (var i = 0; i < allGames.length; i++) {
    var g = allGames[i];
    if (!g.result) continue;
    var myTeam = STATE.careerTeam;
    var opp = g.game.opponent;
    if (g.result.won) { if (st[myTeam]) st[myTeam].wins++; if (st[opp]) st[opp].losses++; }
    else { if (st[myTeam]) st[myTeam].losses++; if (st[opp]) st[opp].wins++; }
  }
  // 统计联盟其他比赛
  var leagueGames = STATE.season._leagueGameLog || [];
  for (var j = 0; j < leagueGames.length; j++) {
    var lg = leagueGames[j];
    if (st[lg.home]) { if (lg.won) st[lg.home].wins++; else st[lg.home].losses++; }
    if (st[lg.away]) { if (!lg.won) st[lg.away].wins++; else st[lg.away].losses++; }
  }
}

/** 估算球员场均数据（基于属性 + af 系数） */
function estimatePlayerStats(player) {
  var f = function(v) { return af(parseInt(v) || 50); };
  var pos = (player.pos || 'SF').split('/')[0].trim();
  var pts = (f(player.FIN) * 0.4 + f(player.MID) * 0.3 + f(player.threePT) * 0.3) * 22 + 2;
  var reb = f(player.REB) * (pos === 'C' ? 14 : pos === 'PF' ? 10 : 6) + 1;
  var ast = f(player.PAS) * (pos === 'PG' ? 10 : pos === 'SG' ? 6 : 4) + 1;
  var stl = f(player.PDEF) * 3 + 0.3;
  var blk = f(player.BLK) * (pos === 'C' ? 4 : pos === 'PF' ? 2.5 : 0.5) + 0.2;
  return { pts: Math.round(pts * 10) / 10, reb: Math.round(reb * 10) / 10, ast: Math.round(ast * 10) / 10, stl: Math.round(stl * 10) / 10, blk: Math.round(blk * 10) / 10, pos: pos, ovr: parseInt(player.ovr) || 50 };
}

/** 获取用户场均数据 */

  var ps = STATE.season.playerStats;

  return { pts: Math.round(ps.pts / gp * 10) / 10, reb: Math.round(ps.reb / gp * 10) / 10, ast: Math.round(ps.ast / gp * 10) / 10, stl: Math.round(ps.stl / gp * 10) / 10, blk: Math.round(ps.blk / gp * 10) / 10, pos: STATE.position, ovr: STATE.finalOVR };
}

// ==================== 赛程生成（真实NBA赛程）====================
function buildRealSchedule() {
  const myTeam = STATE.careerTeam;
  const rawSchedule = NBA2K_SCHEDULE[myTeam];
  if (!rawSchedule) {
    console.error('No schedule for', myTeam);
    return;
  }
  
  const schedule = rawSchedule.map(g => ({
    opponent: g.opponent,
    home: g.home,
    gameNum: g.gameNum,
    day: g.day,
    simulated: false,
    result: null,
  }));
  
  STATE.season.schedule = schedule;
  
  // ★ 构建每日比赛映射（去重）
  const dayMap = {};
  // 遍历所有球队的赛程，每场比赛只记一次（用home team的entry）
  const seen = new Set();
  Object.keys(NBA2K_SCHEDULE).forEach(team => {
    NBA2K_SCHEDULE[team].forEach(g => {
      if (!g.home) return; // 只记主队entry（避免重复）
      const gameKey = `${g.day}-${team}-${g.opponent}`;
      if (seen.has(gameKey)) return;
      seen.add(gameKey);
      if (!dayMap[g.day]) dayMap[g.day] = [];
      dayMap[g.day].push({ home: team, away: g.opponent });
    });
  });
  STATE.season._dayMap = dayMap;
  STATE.season._processedDays = new Set();
  STATE.season._leagueGameLog = [];
  
  // renderGameList();  // 日历模式已注释
}

/** 模拟到目前为止所有未处理的比赛日 */
function simDayLeagueGames(day) {
  const dayMap = STATE.season._dayMap;
  if (!dayMap) return;
  const processed = STATE.season._processedDays || new Set();
  
  // 找到所有 <= day 且未处理的比赛日，一次性处理
  const daysToProcess = Object.keys(dayMap)
    .map(Number)
    .filter(d => d <= day && !processed.has(d))
    .sort((a, b) => a - b);
  
  if (daysToProcess.length === 0) return;
  
  const standings = STATE.season.standings;
  
  daysToProcess.forEach(d => {
    processed.add(d);
    const games = dayMap[d];
    if (!games) return;
    
    games.forEach(g => {
      // 跳过包含我方球队的比赛（这些已经通过我们的比赛模拟过了）
      if (g.home === STATE.careerTeam || g.away === STATE.careerTeam) return;
      
      const p1 = calcTeamPowerWithPlayer(g.home);
      const p2 = calcTeamPowerWithPlayer(g.away);
      // ★ 用差值法计算胜率，与 simulateGameNew 一致
      const netRating1 = (p1.offense - p2.offense) * 0.4 + (p1.defense - p2.defense) * 0.4 + (p1.depth - p2.depth) * 0.2;
      const winProb = 0.5 + netRating1 / 25;  // 强弱队胜率拉开，最强vs最弱≈84%
      const clampedProb = Math.max(0.15, Math.min(0.85, winProb));
      
      if (Math.random() < clampedProb) {
        standings[g.home].wins++; standings[g.away].losses++;
        updateStreak(g.home, true); updateStreak(g.away, false);
        if (STATE.season._leagueGameLog) STATE.season._leagueGameLog.push({ home: g.home, away: g.away, won: true });
      } else {
        standings[g.away].wins++; standings[g.home].losses++;
        updateStreak(g.away, true); updateStreak(g.home, false);
        if (STATE.season._leagueGameLog) STATE.season._leagueGameLog.push({ home: g.home, away: g.away, won: false });
      }
    });
  });
  
  STATE.season._processedDays = processed;
}

// ==================== 新比赛引擎 ====================
/** 解析位置：返回该球员能打的所有位置 */
function getPlayerPositions(posStr) {
  if (!posStr) return [];
  return posStr.split(' / ').map(s => s.trim()).filter(Boolean);
}

/** 判断球员是否能打某位置 */
function canPlayPosition(playerPos, targetPos) {
  return getPlayerPositions(playerPos).includes(targetPos);
}

/** 获取球员显示位置（给UI用） */
function getPositionDisplay(posStr) {
  if (!posStr) return '—';
  return posStr;
}

/** 按位置计算球队首发+轮换（用户强制首发） */
function calcTeamLineup(team) {
  const allPlayers = (NBA2K_DATA[team] || []).slice();
  let userPlayer = null;
  
  // 如果是你的球队，把你加入阵容
  if (team === STATE.careerTeam && STATE.finalOVR) {
    // ★ 季后赛用户评分 debuff：OVR 降低，模拟季后赛强度更大、被针对
    const isPlayoffs = STATE.season?.isPlayoffs;
    const playoffDebuff = isPlayoffs ? 5 : 0;
    var _displayName = getDisplayName();
    userPlayer = {
      name: _displayName,
      cname: _displayName,
      ovr: Math.max(60, parseInt(STATE.finalOVR) - playoffDebuff),
      pos: STATE.position,
      ...STATE.attrs,
      _isUser: true,
      _playoffDebuff: playoffDebuff,
    };
    allPlayers.push(userPlayer);
  }
  
  const POS_ORDER = ['PG', 'SG', 'SF', 'PF', 'C'];
  const starters = {};
  const assigned = new Set();
  
  if (userPlayer && STATE.position && POS_ORDER.includes(STATE.position)) {
    // ★ 新逻辑：
    //   1. 算原始首发5人（不含用户）
    //   2. 判断用户能否进首发（OVR ≥ 该位置原始首发）
    //   3. 能 → 替换首发，被替换者进替补
    //   4. 不能 → 用户进替补，原始首发5人全部保留
    
    // 1. 算原始首发阵容（不含用户）
    const origStarters = {};
    const origAssigned = new Set();
    
    POS_ORDER.forEach(pos => {
      const eligible = allPlayers
        .map((p, i) => ({ player: p, idx: i }))
        .filter(({ idx }) => !origAssigned.has(idx))
        .filter(({ player }) => player !== userPlayer)
        .filter(({ player }) => canPlayPosition(player.pos || '', pos))
        .sort((a, b) => b.player.ovr - a.player.ovr);
      if (eligible.length > 0) {
        origAssigned.add(eligible[0].idx);
        origStarters[pos] = eligible[0].player;
      }
    });
    
    // 2. 判断：用户OVR +5 > 该位置原始首发的OVR？（+5缓冲，接近即可首发）
    const targetStarter = origStarters[STATE.position];
    const canStart = targetStarter ? (STATE.finalOVR >= parseInt(targetStarter.ovr)) : true;
    
    
    if (canStart) {
      // 能首发：用户替换同位置原始首发，被替换者进替补，其他4个位置不变
      POS_ORDER.forEach(pos => {
        if (pos === STATE.position) {
          const userIdx = allPlayers.indexOf(userPlayer);
          assigned.add(userIdx);
          starters[pos] = userPlayer;
        } else if (origStarters[pos]) {
          const idx = allPlayers.indexOf(origStarters[pos]);
          assigned.add(idx);
          starters[pos] = origStarters[pos];
        }
      });
    } else {
      // 不能首发：原始首发5人全部保留，用户进替补
      POS_ORDER.forEach(pos => {
        if (origStarters[pos]) {
          const idx = allPlayers.indexOf(origStarters[pos]);
          assigned.add(idx);
          starters[pos] = origStarters[pos];
        }
      });
    }
    
    // 3. 如有空缺位置（原始阵容某位置无人能打），补充填满
    POS_ORDER.forEach(pos => {
      if (!starters[pos]) {
        const eligible = allPlayers
          .map((p, i) => ({ player: p, idx: i }))
          .filter(({ idx }) => !assigned.has(idx))
          .filter(({ player }) => canPlayPosition(player.pos || '', pos))
          .sort((a, b) => b.player.ovr - a.player.ovr);
        if (eligible.length > 0) {
          assigned.add(eligible[0].idx);
          starters[pos] = eligible[0].player;
        }
      }
    });
    
  } else {
    // ★ 原逻辑：没有用户时的处理
    if (userPlayer && STATE.position && POS_ORDER.includes(STATE.position)) {
      const userIdx = allPlayers.indexOf(userPlayer);
      assigned.add(userIdx);
      starters[STATE.position] = userPlayer;
    }
    
    const remainingPositions = POS_ORDER.filter(p => !starters[p]);
    remainingPositions.forEach(pos => {
      const eligible = allPlayers
        .map((p, i) => ({ player: p, idx: i }))
        .filter(({ idx }) => !assigned.has(idx))
        .filter(({ player }) => canPlayPosition(player.pos || '', pos))
        .sort((a, b) => b.player.ovr - a.player.ovr);
      if (eligible.length > 0) {
        assigned.add(eligible[0].idx);
        starters[pos] = eligible[0].player;
      }
    });
  }
  
  // 替补：剩余球员按OVR排序取前5
  let bench = allPlayers
    .map((p, i) => ({ player: p, idx: i }))
    .filter(({ idx }) => !assigned.has(idx))
    .sort((a, b) => b.player.ovr - a.player.ovr)
    .slice(0, 5)
    .map(e => e.player);
  
  // 如果用户没进首发，确保他一定在替补阵容中（替换掉替补中OVR最低的人）
  if (userPlayer && !starters[STATE.position] && !bench.includes(userPlayer)) {
    if (bench.length >= 5) bench.pop();
    bench.push(userPlayer);
    bench.sort((a, b) => b.ovr - a.ovr);
  }
  
  return { starters, bench, allPlayers, isUserStarter: !!userPlayer };
}

/** 按位置计算球队实力（首发5人 + 2重要轮换） */
function calcTeamPowerWithPlayer(team) {
  const lineup = calcTeamLineup(team);
  const cfg = SIM_CONFIG.TEAM_POWER;
  
  const starters = Object.values(lineup.starters);
  const bench = lineup.bench.slice(0, 2);  // 只取前2名轮换
  const roster = starters.concat(bench);
  
  if (roster.length === 0) return { offense: 50, defense: 50, athletic: 50, clutch: 50, depth: 50 };
  
  // 首发5人总权重85%，按OVR比例分配（球星影响力更大）
  const totalStarterOVR = starters.reduce((s, p) => s + (parseInt(p.ovr) || 50), 0);
  const benchWeight = 0.15 / bench.length;
  
  const weightedRoster = roster.map((p, i) => ({
    player: p,
    weight: i < starters.length
      ? 0.85 * ((parseInt(p.ovr) || 50) / totalStarterOVR)
      : benchWeight,
  }));
  
  function calcDim(weights) {
    let sum = 0, totalW = 0;
    Object.entries(weights).forEach(([attr, w]) => {
      const weightedAvg = weightedRoster.reduce((s, { player, weight }) => 
        s + (parseInt(player[attr]) || 50) * weight, 0);
      sum += weightedAvg * w;
      totalW += w;
    });
    return totalW > 0 ? sum / totalW : 50;
  }
  
  const overall = weightedRoster.reduce((s, { player, weight }) => 
    s + (parseInt(player.ovr) || 50) * weight, 0);
  
  return {
    offense: calcDim(cfg.offense),
    defense: calcDim(cfg.defense),
    athletic: calcDim(cfg.athletic),
    clutch: calcDim(cfg.clutch),
    depth: overall,
  };
}

/** 比赛模拟 — 使用统一胜率公式 + 详细比分生成 */
function simulateGameNew(teamA, teamB, seedBonus, probMultiplier) {
  const powerA = calcTeamPowerWithPlayer(teamA);
  const powerB = calcTeamPowerWithPlayer(teamB);
  const config = SIM_CONFIG;
  
  // ★ 第一步：用统一胜率公式决定胜负
  const netRatingA = (powerA.offense - powerB.offense) * 0.4 
                   + (powerA.defense - powerB.defense) * 0.4 
                   + (powerA.depth - powerB.depth) * 0.2
                   + (seedBonus || 0);  // 季后赛种子保护：高顺位概率加成
  const winProb = 0.5 + netRatingA / 25;
  const clampedProb = Math.max(0.15, Math.min(0.85, winProb));
  // ★ 概率乘数（用于季后赛用户 debuff）
  const finalProb = probMultiplier != null ? Math.max(0.10, clampedProb * probMultiplier) : clampedProb;
  const predeterminedWinner = Math.random() < finalProb ? teamA : teamB;
  
  // ★ 第二步：生成展示用比分（不影响胜负结果）
  // 计算节奏
  const paceA = config.PACE.base + (Math.random() - 0.5) * config.PACE.teamRange;
  const paceB = config.PACE.base + (Math.random() - 0.5) * config.PACE.teamRange;
  const gamePace = (paceA + paceB) / 2;
  const possPerQ = Math.round(gamePace / 4);
  
  let scoreA = 0, scoreB = 0;
  let highlight = false;
  let keyEvents = [];
  let momentum = 1.0;
  let qScoresA = [], qScoresB = [];
  
  // 查找赛程，确认主客场
  const schedule = STATE.season.schedule || [];
  const gameIdx = schedule.findIndex(g => !g.simulated);
  const isHome = gameIdx >= 0 ? schedule[gameIdx]?.home : true;
  const isB2B = gameIdx > 0 && schedule[gameIdx-1]?.isB2B;
  
  // ★ 根据预定胜者设置倾向
  const desiredWinner = predeterminedWinner;
  
  for (let q = 0; q < 4; q++) {
    const baseQ = possPerQ;
    
    // 实力差值影响比分展示（小幅度，不决定胜负）
    const offDefDiffA = (powerA.offense - powerB.defense) / 120;
    const offDefDiffB = (powerB.offense - powerA.defense) / 120;
    
    // 主场加成
    const homeBonusQ = isHome ? 1.0 : 0;
    
    // 每节得分 = 基准 + 实力展示 + 主场 + 大随机
    let ptsA = baseQ + offDefDiffA * 3 + homeBonusQ + (momentum - 1) * 1.5;
    let ptsB = baseQ + offDefDiffB * 3;
    
    // 确保预定胜者适度领先
    const currentDiff = (scoreA + ptsA) - (scoreB + ptsB);
    const targetLead = desiredWinner === teamA ? 1 : -1;
    if ((desiredWinner === teamA && currentDiff < targetLead) ||
        (desiredWinner === teamB && currentDiff > targetLead)) {
      if (desiredWinner === teamA) ptsA += 2;
      else ptsB += 2;
    }
    
    // 背靠背
    if (isB2B) { ptsA *= 0.96; ptsB *= 0.96; }
    
    // ★ 大随机波动 ±25%
    ptsA *= (0.75 + Math.random() * 0.50);
    ptsB *= (0.75 + Math.random() * 0.50);
    
    // 落后方反扑
    if (Math.abs(currentDiff) > 10) {
      const comeback = 1 + Math.abs(currentDiff) * 0.003;
      if (currentDiff > 0) ptsB *= comeback; else ptsA *= comeback;
    }
    
    const qA = Math.max(8, Math.round(ptsA));
    const qB = Math.max(8, Math.round(ptsB));
    
    scoreA += qA;
    scoreB += qB;
    qScoresA.push(qA);
    qScoresB.push(qB);
    
    // 随机事件
    if (Math.random() < 0.08) {
      const bonus = 3 + Math.round(Math.random() * 8);
      if (Math.random() > 0.5) { scoreA += bonus; keyEvents.push(`🔥 ${getTeamName(teamA)} 单节爆发 +${bonus}`); }
      else { scoreB += bonus; keyEvents.push(`🔥 ${getTeamName(teamB)} 单节爆发 +${bonus}`); }
      highlight = true;
    }
    
    momentum = momentum * 0.7 + 0.3;
  }
  
  // 关键球/绝杀
  if (Math.abs(scoreA - scoreB) < 6 && Math.random() < 0.35) {
    highlight = true;
    if (Math.random() > 0.5) { scoreA += 3; keyEvents.push('⚡ 关键三分！'); }
    else { scoreB += 3; keyEvents.push('⚡ 关键三分！'); }
  }
  if (Math.abs(scoreA - scoreB) <= 3 && Math.random() < 0.12) {
    highlight = true;
    if (Math.random() > 0.5) { scoreA += 3; keyEvents.push('🏆 压哨绝杀！'); }
    else { scoreB += 3; keyEvents.push('💔 被压哨绝杀...'); }
  }
  
  // 加时
  let ot = 0;
  while (Math.abs(scoreA - scoreB) < 3 && ot < 3) {
    ot++;
    scoreA += Math.round(4 + Math.random() * 8);
    scoreB += Math.round(4 + Math.random() * 8);
    keyEvents.push(`⏱ 加时赛 #${ot}`);
    highlight = true;
  }
  
  // ★ 最终结果由预定胜者决定
  const won = predeterminedWinner === teamA;
  // 确保比分方向正确
  if (won && scoreB >= scoreA) { scoreA += 2; }
  else if (!won && scoreA >= scoreB) { scoreB += 2; }
  
  // 冷门检测
  const avgA = (powerA.offense + powerA.defense) / 2;
  const avgB = (powerB.offense + powerB.defense) / 2;
  if (won !== (avgA > avgB) && Math.abs(avgA - avgB) > 3) {
    highlight = true;
    keyEvents.push('💥 爆冷！');
  }
  
  return {
    won, scoreA, scoreB,
    qScoresA, qScoresB,
    highlight, keyEvents, ot,
    teamA: { power: powerA },
    teamB: { power: powerB },
    pace: gamePace,
    possPerQ,
    boxScore: generateBoxScore(teamA, teamB, scoreA, scoreB),
  };
}

/** 生成两队全队数据（确保总分=比分） */
function generateBoxScore(teamA, teamB, totalA, totalB) {
  function getLineupStats(team, totalPts) {
    const lineup = calcTeamLineup(team);
    // 展示所有轮换球员（首发5人 + 替补前5 = 10人）
    const players = Object.values(lineup.starters).concat(lineup.bench.slice(0, 5));
    if (players.length === 0) return [];
    
    // 按OVR从高到低排序（替补排最后）
    players.sort((a, b) => (parseInt(b.ovr)||0) - (parseInt(a.ovr)||0));
    
    // 计算得分权重：OVR为主（指数放大差距），进攻技能微调
    const minOvr = Math.min(...players.map(p => parseInt(p.ovr)||50));
    const maxOvr = Math.max(...players.map(p => parseInt(p.ovr)||50));
    const weights = players.map((p, idx) => {
      const ovr = parseInt(p.ovr) || 50;
      // OVR指数放大：55以下几乎不得分，越高差距越大
      const ovrFactor = Math.pow(Math.max(0, (ovr - 55) / 44), 2.0);
      // 进攻技能微调（±20%）
      const offBonus = (af(parseInt(p.threePT)||50) + af(parseInt(p.FIN)||50) + af(parseInt(p.MID)||50)) / 3;
      // 得分手加成：前几得分点获得额外权重
      const starBonus = Math.max(0.6, 1.3 - idx * 0.15);
      return Math.max(0.05, ovrFactor * (0.7 + 0.3 * offBonus) * starBonus);
    });
    const totalW = weights.reduce((a, b) => a + b, 0);
    
    // 分配得分（确保总和=totalPts）
    let allocated = weights.map((w, i) => Math.round(totalPts * w / totalW));
    let diff = totalPts - allocated.reduce((a, b) => a + b, 0);
    if (diff !== 0) {
      const best = weights.indexOf(Math.max(...weights));
      allocated[best] = Math.max(0, allocated[best] + diff);
    }
    
    // 确保每人至少1分（只要他上场）
    allocated = allocated.map(v => Math.max(1, v));
    // 如有差额从得分王扣/补
    let sum = allocated.reduce((a, b) => a + b, 0);
    const bestIdx = weights.indexOf(Math.max(...weights));
    if (sum > totalPts) {
      allocated[bestIdx] -= (sum - totalPts);
      if (allocated[bestIdx] < 0) allocated[bestIdx] = 0;
    } else if (sum < totalPts) {
      allocated[bestIdx] += (totalPts - sum);
    }
    
    return players.map((p, i) => {
      const pos = (p.pos || 'SF').split('/')[0].trim();
      const ovr = parseInt(p.ovr) || 50;
      const ath = af(parseInt(p.ATH)||50);
      const reb = af(parseInt(p.REB)||50);
      const pas = af(parseInt(p.PAS)||50) * 0.5 + af(parseInt(p.HAN)||50) * 0.3 + af(parseInt(p.CLU)||50) * 0.2;
      const pdef = af(parseInt(p.PDEF)||50);
      const blk = af(parseInt(p.BLK)||50) * 0.5 + af(parseInt(p.IDEF)||50) * 0.5;
      const han = af(parseInt(p.HAN)||50) * 0.5 + af(parseInt(p.CLU)||50) * 0.5;
      
      const pts = allocated[i];
      // 上场时间：核心主力>角色球员
      const mins = i < 5
        ? 26 + Math.round((1 - i * 0.15) * 12 + Math.random() * 4)
        : 8 + Math.round(Math.random() * 8);
      const fga = Math.round(Math.max(2, pts * 0.7 + Math.random() * 4));
      const fgm = Math.min(fga, Math.max(0, Math.round(fga * (0.32 + Math.random() * 0.28))));
      
      return {
        name: p.cname || p.name,
        pos, pts,
        reb: Math.round(reb * 4 + Math.random() * 3 + 1),
        ast: Math.round(pas * 5 + Math.random() * 2),
        stl: Math.round(pdef * 1.2 + Math.random() * 1),
        blk: Math.round(blk * 1.2 + Math.random() * 1),
        tov: Math.round(1 + (1 - Math.min(1, han)) * 2.5 + Math.random() * 1),
        fgm, fga,
        mins,
        isUser: p._isUser || false,
      };
    });
  }
  
  return {
    [teamA]: getLineupStats(teamA, totalA),
    [teamB]: getLineupStats(teamB, totalB),
  };
}

/** 属性→效率系数：递减曲线
 *  低属性几乎没用，高属性才有显著收益
 *  35→0.18  50→0.39  65→0.57  75→0.69  85→0.82  95→0.94  99→1.00
 */
function attrFactor(val) {
  const v = Math.max(25, Math.min(99, val || 50));
  return Math.pow((v - 25) / 74, 0.85);
}

/** 严格版：只有顶尖属性才能展现顶尖数据（attrFactor^1.5）
 *  35→0.08  50→0.24  65→0.43  78→0.65  90→0.83  99→1.00
 *  用在所有数据计算上，拉开一般和顶级的差距
 */
function af(val) { return Math.pow(attrFactor(val), 1.5); }

/** 生成你的球员数据 — 由单项属性决定，不是总评 */
function generatePlayerStatsNew(attrs, gameResult, isPlayoff) {
  const cfg = SIM_CONFIG.PLAYER_STATS;
  const pos = STATE.position || 'PG';
  const posScale = cfg.POS_SCALE[pos] || cfg.POS_SCALE.PG;
  
  // 节奏和出场时间
  const totalScore = gameResult.scoreA + gameResult.scoreB;
  const paceFactor = Math.min(totalScore / 210, 1.4);
  const mins = isPlayoff ? 38 : (30 + Math.round(Math.random() * 8));
  const minsFactor = mins / 48;
  
  // 球队总投篮数
  const teamFGA = Math.round((totalScore / 2) * 0.85);
  
  // ★ 球权/使用率由进攻属性决定 — 按位置选择核心进攻属性
  const posOffAttrs = {
    'PG': ['threePT','MID','HAN','PAS'],
    'SG': ['threePT','MID','FIN','HAN'],
    'SF': ['threePT','MID','FIN','DNK','ATH'],
    'PF': ['MID','FIN','DNK','STR','REB'],
    'C':  ['FIN','DNK','STR','MID'],
  };
  const offAttrList = posOffAttrs[pos] || posOffAttrs['SF'];
  const offAttrs = offAttrList.map(k => parseInt(attrs[k]) || 50);
  const offAvg = offAttrs.reduce((a, b) => a + b, 0) / offAttrs.length;
  const offFactor = af(offAvg);
  const baseUsage = cfg.USAGE[pos] || 0.20;
  // ★ 根据总评梯度调整使用率：≤75用原系数，>75每多点提升
  const myOVR = STATE.finalOVR || 75;
  const usageScale = myOVR > 75 ? 1 + (myOVR - 75) * 0.018 : 1.0;
  const scaledUsage = baseUsage * Math.min(1.8, usageScale);
  
  // ★ 出手数 = 球队投篮 × 使用率 × (保底+严格天赋) × 时间
  // ★ 方案A：出手数 ±40% 波动
  let fga = Math.round(teamFGA * scaledUsage * (0.1 + offFactor * 0.9) * minsFactor * (0.6 + Math.random() * 0.8));
  const maxFga = Math.round((1 + offFactor * 24) * Math.max(0.7, Math.min(1.5, usageScale)));
  fga = Math.max(2, Math.min(maxFga, fga));
  
  // 投篮分布 — 按属性动态调整 (Experimental)
  const baseDist = SIM_CONFIG.SHOT_DIST[pos] || SIM_CONFIG.SHOT_DIST.PG;
  const threePtAttr = parseInt(attrs.threePT) || 50;
  const finAttr = ((parseInt(attrs.FIN)||50) + (parseInt(attrs.DNK)||50)) / 2;
  const midAttr = parseInt(attrs.MID) || 50;
  let dynDist = { threePT: baseDist.threePT, MID: baseDist.MID, FIN: baseDist.FIN };
  // 三分属性每高/低于50 1点，三分占比调整0.3%
  dynDist.threePT = Math.max(0.05, Math.min(0.55, dynDist.threePT + (threePtAttr - 50) * 0.003));
  // 终结属性调整内线占比
  dynDist.FIN = Math.max(0.05, Math.min(0.55, dynDist.FIN + (finAttr - 50) * 0.002));
  // 中投属性调整中投占比  
  dynDist.MID = Math.max(0.05, Math.min(0.55, dynDist.MID + (midAttr - 50) * 0.002));
  const totalDist = dynDist.threePT + dynDist.MID + dynDist.FIN;
  const threeA = Math.round(fga * (dynDist.threePT / totalDist));
  const midA = Math.round(fga * (dynDist.MID / totalDist));
  const finA = fga - threeA - midA;
  
  // ★ 命中率由对应属性决定
  // 三分只看threePT，中投只看MID，终结看FIN+DNK平均
  const threePct = calcShotPct('threePT', attrs.threePT || 50, totalScore);
  const midPct = calcShotPct('MID', attrs.MID || 50, totalScore);
  const finAvg = ((attrs.FIN||50) + (attrs.DNK||50)) / 2;
  const finPct = calcShotPct('FIN', finAvg, totalScore);
  
  const threeM = Math.round(Math.max(0, threeA * threePct));
  const midM = Math.round(Math.max(0, midA * midPct));
  const finM = Math.round(Math.max(0, finA * finPct));
  const fgm = threeM + midM + finM;
  
  // ★ 罚球由FIN和CLU决定
  const ftRate = Math.min(0.30, 0.10 + (attrs.FIN || 50) / 500);
  const fta = Math.round(fga * ftRate * (0.6 + Math.random() * 0.8));
  const ftPct = calcShotPct('FT', attrs.CLU || 50, totalScore);
  const ftm = Math.round(fta * ftPct);
  
  const pts = threeM * 3 + midM * 2 + finM * 2 + ftm;
  
  // ★ 篮板 = REB属性 × 严格递减曲线
  const rebScale = posScale.reb || 0.35;
  // ★ 篮板 ±30% 波动 (原±60%)
  const rebVal = af(attrs.REB) * (totalScore / 200) * rebScale * 12 * (0.7 + Math.random() * 0.6);
  const reb = Math.round(Math.max(0, rebVal));
  
  // ★ 助攻 = 手感 + 传球 + 关键 共同决定
  const astScale = posScale.ast || 0.4;
  const pasAvg = ((attrs.PAS||50) + (attrs.HAN||50) + (attrs.CLU||50)) / 3;
  // ★ 助攻 ±30% 波动 (原±60%)
  const astVal = af(pasAvg) * (totalScore / 200) * astScale * 9 * (0.7 + Math.random() * 0.6);
  const ast = Math.round(Math.max(0, astVal));
  
  // ★ 抢断 = PDEF主导 + ATH/HAN辅助（按位置权重）
  const stlF = SIM_CONFIG.PLAYER_STATS.FACTORS[pos].stl;
  const stlSum = stlF.PDEF + (stlF.ATH || 0) + (stlF.HAN || 0);
  const stlAvg = (af(attrs.PDEF||50) * stlF.PDEF + af(attrs.ATH||50) * (stlF.ATH || 0) + af(attrs.HAN||50) * (stlF.HAN || 0)) / stlSum;
  // ★ 抢断 ±30% 波动 (原±60%)
  const stlVal = stlAvg * (totalScore / 200) * 2.0 * (0.7 + Math.random() * 0.6);
  const stl = Math.round(Math.max(0, stlVal) * 10) / 10;
  
  // ★ 盖帽 = BLK主导 + IDEF辅助 + ATH微调（按位置权重）
  const blkF = SIM_CONFIG.PLAYER_STATS.FACTORS[pos].blk;
  const blkSum = blkF.BLK + (blkF.IDEF || 0) + (blkF.ATH || 0);
  const blkAvg = (af(attrs.BLK||50) * blkF.BLK + af(attrs.IDEF||50) * (blkF.IDEF || 0) + af(attrs.ATH||50) * (blkF.ATH || 0)) / blkSum;
  // ★ 盖帽 ±30% 波动 (原±60%)
  const blkVal = blkAvg * (totalScore / 200) * 2.0 * (0.7 + Math.random() * 0.6);
  const blk = Math.round(Math.max(0, blkVal) * 10) / 10;
  
  // ★ 失误 = (HAN+CLU)/2 × 严格递减曲线（越高失误越少）(Experimental: 上调上限)
  const hanCluAvg = ((attrs.HAN||50) + (attrs.CLU||50)) / 2;
  const tovVal = fga * 0.2 * (1.0 - af(hanCluAvg) * 0.4);
  const tov = Math.round(Math.max(0.5, tovVal) * 10) / 10;
  
  return { pts, reb, ast, stl, blk, tov, fgm, fga, ftm, fta, threeM, threeA, mins };
}

function calcShotPct(type, attrVal, totalScore) {
  const cfg = SIM_CONFIG.SHOOTING[type];
  if (!cfg) return 0.40;
  
  let pct = cfg.base + (attrVal - 50) * cfg.attrFactor;
  
  // 防守压力
  if (totalScore) {
    if (totalScore > 220) pct += 0.015;
    if (totalScore < 180) pct -= 0.015;
  }
  
  // 低属性额外惩罚：属性低于60时命中率明显下降
  if (attrVal < 60) {
    pct -= (60 - attrVal) * 0.005;
  }
  
  // 随机波动 (Experimental: 从 ±20% 缩减到 ±8%)
  pct *= (0.92 + Math.random() * 0.16);
  
  return Math.max(cfg.min || 0.25, Math.min(cfg.max || 0.70, pct));
}

function updateStreak(team, won) {
  const s = STATE.season.standings[team];
  if (!s) return;
  if (s.streakLen > 0 && won === (s.streak === 'W')) {
    s.streakLen++;
  } else {
    s.streak = won ? 'W' : 'L';
    s.streakLen = 1;
  }
}

/** 处理所有剩余比赛日（赛季结束时调用） */
function processAllRemainingDays() {
  const dayMap = STATE.season._dayMap;
  if (!dayMap) return;
  var keys = Object.keys(dayMap);
  if (keys.length === 0) return;
  const maxDay = Math.max(...keys.map(Number));
  simDayLeagueGames(maxDay);
}

/** 赛季结束 — 停留在赛季页面，让用户选择下一步 */
function showEndOfSeason() {
  processAllRemainingDays();
  // 隐藏 sh-top，只显示 eos-container
  html('season-header').innerHTML = '';
  const seed = getConferenceSeed(STATE.careerTeam);
  
  let actionBtn = '';
  let emoji = '';
  if (seed <= 6) {
    emoji = '🏀';
    actionBtn = `<button class="btn btn-gold btn-sm" onclick="renderPlayoffs()" style="flex:1;">🏀 进入季后赛（${seed}号种子）</button>`;
  } else if (seed <= 10) {
    emoji = '🔥';
    actionBtn = `<button class="btn btn-gold btn-sm" onclick="renderPlayoffs()" style="flex:1;">🔥 附加赛（${seed}号种子）</button>`;
  } else {
    emoji = '📊';
    actionBtn = `<button class="btn btn-gold btn-sm" onclick="showSeasonResults()" style="flex:1;">📊 查看赛季总结</button>`;
  }
  
  const conf = getConference(STATE.careerTeam);
  const confName = conf === 'EAST' ? '东部' : '西部';
  
  html('season-controls').innerHTML = `
    <div class="eos-container">
      <div class="eos-emoji">${emoji}</div>
      <div class="eos-title">常规赛结束</div>
      <div class="eos-record">${STATE.season.wins}-${STATE.season.losses}</div>
      <div class="eos-detail">${confName} 第 ${seed} 名</div>
      <div class="eos-actions">
        ${actionBtn}
      </div>
    </div>
  `;
  // 滚动到顶部
  document.querySelector('.sim-header')?.scrollIntoView({ behavior: 'smooth' });
}

// ==================== 新 GameCast ====================
function renderGameCastNew(game, result, stats) {
  const container = html('gamecast-area');
  let castHtml = `<div class="gamecast">`;
  
  const qLabels = ['第一节', '第二节', '第三节', '第四节'];
  const teamName = getTeamName(STATE.careerTeam);
  const oppName = getTeamName(game.opponent);
  
  for (let q = 0; q < 4; q++) {
    const qA = result.qScoresA?.[q] || Math.round(result.scoreA / 4);
    const qB = result.qScoresB?.[q] || Math.round(result.scoreB / 4);
    const cumA = result.qScoresA?.slice(0, q+1).reduce((a,b)=>a+b, 0) || Math.round(result.scoreA * (q+1) / 4);
    const cumB = result.qScoresB?.slice(0, q+1).reduce((a,b)=>a+b, 0) || Math.round(result.scoreB * (q+1) / 4);
    
    castHtml += `<div class="gc-row ${q === 3 ? 'gc-final' : ''}">
      <span class="gc-q">${qLabels[q]}</span>
      <span class="gc-score ${cumA > cumB ? 'gc-winning' : 'gc-losing'}">${qA}-${qB}</span>
      <span class="gc-total">(${cumA}-${cumB})</span>
      ${q === 3 && stats ? `<span class="gc-stats">📊 ${stats.pts}分 ${stats.reb}板 ${stats.ast}助</span>` : ''}
    </div>`;
  }
  
  if (result.ot) {
    castHtml += `<div class="gc-row gc-ot">
      <span class="gc-q">加时</span>
      <span class="gc-score">${result.scoreA - (result.qScoresA?.reduce((a,b)=>a+b,0) || 0)}-${result.scoreB - (result.qScoresB?.reduce((a,b)=>a+b,0) || 0)}</span>
    </div>`;
  }
  
  if (result.keyEvents && result.keyEvents.length > 0) {
    castHtml += `<div class="gc-events">`;
    result.keyEvents.forEach(e => {
      castHtml += `<div class="gc-event">⚡ ${e}</div>`;
    });
    castHtml += `</div>`;
  }
  
  // 你的球员表现
  if (stats) {
    const pct = stats.fga > 0 ? Math.round(stats.fgm / stats.fga * 100) : 0;
    const threePct = stats.threeA > 0 ? Math.round(stats.threeM / stats.threeA * 100) : 0;
    castHtml += `<div class="gc-player-line">
      <span class="gc-player-name">我的球员</span>
      <span>${stats.pts}分 / ${stats.reb}板 / ${stats.ast}助</span>
      <span style="color:var(--text-dim);font-size:11px;">${stats.fgm}-${stats.fga} (${pct}%) / ${stats.threeM}-${stats.threeA} (${threePct}%) / ${stats.ftm}-${stats.fta}</span>
    </div>`;
  }
  
  castHtml += `<div class="gc-result ${result.won ? 'result-win' : 'result-loss'}">
    ${result.won ? '✅ 胜利' : '❌ 失利'} · ${result.scoreA}-${result.scoreB}
    <span style="font-size:12px;color:var(--text-dim);">${teamName} vs ${oppName}</span>
  </div>`;
  
  castHtml += `</div>`;
  container.innerHTML = castHtml;
  container.scrollTop = container.scrollHeight;
}

// ==================== 日历赛程 ====================
/** 月份→day区间（day 0 = 2025年10月21日 赛季首日） */
const SEASON_MONTHS = [
  { name: '10月', start: 0, end: 10, firstDate: 21, days: 31, firstWday: 3 },
  { name: '11月', start: 11, end: 40, firstDate: 1, days: 30, firstWday: 6 },
  { name: '12月', start: 41, end: 71, firstDate: 1, days: 31, firstWday: 1 },
  { name: '1月', start: 72, end: 102, firstDate: 1, days: 31, firstWday: 4 },
  { name: '2月', start: 103, end: 130, firstDate: 1, days: 28, firstWday: 0 },
  { name: '3月', start: 131, end: 161, firstDate: 1, days: 31, firstWday: 0 },
  { name: '4月', start: 162, end: 191, firstDate: 1, days: 30, firstWday: 3 },
];

function renderCalendar() {
  if (!STATE._calendarMonth) STATE._calendarMonth = 0;
  const monthIdx = STATE._calendarMonth;
  const month = SEASON_MONTHS[monthIdx];
  if (!month) return;
  
  const schedule = STATE.season.schedule || [];
  const games = STATE.season.games || [];
  const nextGameIdx = schedule.findIndex(g => !g.simulated);
  const nextGame = nextGameIdx >= 0 ? schedule[nextGameIdx] : null;
  
  // 构建比赛查找表: seasonDay → info
  const dayMap = {};
  schedule.forEach(g => {
    if (g.day >= month.start && g.day <= month.end) {
      const result = g.simulated ? (games.find(gg => gg.game.gameNum === g.gameNum)?.result || null) : null;
      dayMap[g.day] = {
        opponent: g.opponent, home: g.home,
        simulated: g.simulated, result,
        isNext: nextGame && g.day === nextGame.day,
      };
    }
  });
  
  // 该月天数 & 第一天星期几
  const totalDays = month.days;
  const firstWday = month.firstWday; // 0=日 1=一 ... 6=六
  
  // 顶部：月份标题 + 排行榜按钮
  let htmlStr = `<div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav" onclick="switchCalendar(${monthIdx - 1})" ${monthIdx === 0 ? 'disabled' : ''}>◀</button>
      <span class="cal-title">${month.name}</span>
      <button class="cal-nav" onclick="switchCalendar(${monthIdx + 1})" ${monthIdx >= SEASON_MONTHS.length - 1 ? 'disabled' : ''}>▶</button>
      <button class="cal-standings-btn" onclick="showStandingsModal()">🏆 排行榜</button>
    </div>`;
  
  // 星期头
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  htmlStr += `<div class="cal-weekdays">${weekdays.map(d => `<span>${d}</span>`).join('')}</div>`;
  
  // 日历网格
  let cells = '';
  
  // 月首空白
  for (let i = 0; i < firstWday; i++) {
    cells += '<div class="cal-cell cal-empty"></div>';
  }
  
  // 该月每一天
  for (let date = 1; date <= totalDays; date++) {
    const seasonDay = month.start + (date - month.firstDate);
    const info = dayMap[seasonDay];
    const isGameDay = !!info;
    const isToday = info?.isNext;
    const isPast = info?.simulated;
    
    let cls = 'cal-cell';
    let content = '';
    let onclick = '';
    
    if (!isGameDay) {
      cls += ' cal-rest';
      content = `<span class="cal-date">${date}</span>`;
    } else if (isPast && info.result) {
      const won = info.result.won;
      cls += won ? ' cal-w' : ' cal-l';
      cls += ' cal-played';
      content = `<span class="cal-date">${date}</span>
        <span class="cal-opp">${info.home ? 'vs' : '@'}${getTeamLogo(info.opponent, 16)}</span>
        <span class="cal-score">${info.result.scoreA}-${info.result.scoreB}</span>`;
      onclick = `onclick="showGamePopup(${seasonDay})"`;
    } else if (isToday) {
      cls += ' cal-today';
      content = `<span class="cal-date">${date}</span>
        <span class="cal-opp">${info.home ? 'vs' : '@'}${getTeamLogo(info.opponent, 16)}</span>`;
      onclick = `onclick="simToDay(${seasonDay})"`;
    } else {
      cls += ' cal-future';
      content = `<span class="cal-date">${date}</span>
        <span class="cal-opp">${info.home ? 'vs' : '@'}${getTeamLogo(info.opponent, 16)}</span>`;
      onclick = `onclick="simToDay(${seasonDay})"`;
    }
    
    cells += `<div class="${cls}" ${onclick}>${content}</div>`;
  }
  
  htmlStr += `<div class="cal-grid">${cells}</div>`;
  
  // 底部 — 只保留进度文字
  htmlStr += `<div class="cal-footer">
    <span style="font-size:10px;color:var(--text-muted);flex:1;text-align:left;">💡 点击赛程表中任意一场比赛，可直接模拟至该场比赛</span>
    <span class="cal-progress">${schedule.filter(g => g.simulated).length} / ${schedule.length} 场</span>
  </div>`;
  
  htmlStr += '</div>';
  document.getElementById('game-list').innerHTML = htmlStr;
}

function switchCalendar(idx) {
  
  if (idx < 0 || idx >= SEASON_MONTHS.length) return;
  STATE._calendarMonth = idx;
  renderCalendar();
}
